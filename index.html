<style>
  :root{
    --face:#D4D0C8;      /* gris de boîte de dialogue */
    --face2:#EFEDE7;
    --win:#FFFFFF;       /* fond de zone de travail */
    --lite:#FFFFFF;      /* biseau clair */
    --lite2:#DFDFDF;
    --shad:#808080;      /* biseau sombre */
    --dark:#404040;
    --ink:#000000;
    --ink2:#3A3A3A;
    --gray:#6D6D6D;
    --nav:#0A246A;       /* bleu de sélection */
    --nav2:#A6CAF0;
    --teal:#008080;
    --maro:#800000;
    --grn:#006000;
    color-scheme:light;
  }
  html,body{height:100%;overflow:hidden;background:#3A6EA5}
  body{
    background:#3A6EA5;color:var(--ink);
    font-family:Tahoma,Verdana,"DejaVu Sans",Geneva,sans-serif;
    font-size:17px;line-height:1.5;
  }
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* biseaux */
  .out{box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .in{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}

  /* ---------- FENÊTRE ---------- */
  .app{height:100%;display:flex;flex-direction:column;background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}

  .tbar{display:flex;align-items:center;gap:8px;margin:3px 3px 0;padding:3px 3px 3px 5px;
    background:linear-gradient(90deg,var(--nav) 0%,#3A6EA5 58%,var(--nav2) 100%);color:#fff}
  .tico{width:17px;height:17px;background:var(--face);display:inline-grid;place-items:center;
    font-size:11px;color:var(--nav);flex:none;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite)}
  .ttl{font-weight:bold;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn{width:23px;height:20px;flex:none;background:var(--face);color:var(--ink);
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .tbtn:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite)}
  .tbtn[disabled]{color:var(--shad);text-shadow:1px 1px 0 var(--lite);cursor:default}

  /* barre de menus */
  .mbar{position:relative;display:flex;gap:1px;margin:2px 3px;padding:1px 2px}
  .mitem{padding:4px 10px;font-size:16px;cursor:pointer}
  .mitem:hover,.mitem.open{background:var(--nav);color:#fff}
  .mitem u{text-decoration:underline}
  .mdrop{position:absolute;top:100%;left:0;z-index:40;min-width:290px;background:var(--face);padding:2px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2),3px 3px 5px rgba(0,0,0,.35)}
  .mdrop button{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;
    padding:6px 20px 6px 24px;font-size:16px;cursor:pointer}
  .mdrop button:hover{background:var(--nav);color:#fff}
  .mdrop button span{color:var(--gray)}
  .mdrop button:hover span{color:#cfd8ef}
  .msep{height:0;margin:3px 2px;border-top:1px solid var(--shad);border-bottom:1px solid var(--lite)}

  .client{flex:1;display:flex;flex-direction:column;gap:9px;padding:6px 9px 9px;min-height:0}
  #fit{transform-origin:top left}
  #dlgzone:empty{display:none}

  /* ---------- GROUPE INDICATEURS ---------- */
  .gbox{border:none;margin:0;padding:11px 13px 13px;position:relative;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--lite),inset -2px -2px 0 var(--shad)}
  .gbox legend{padding:0 5px;font-size:15px;font-weight:bold;color:var(--nav)}
  .gz{display:flex;gap:26px;flex-wrap:wrap}
  .g{display:flex;align-items:center;gap:10px;position:relative;white-space:nowrap;padding-right:52px}
  .g .nm{font-size:14px;color:var(--ink2);flex:none}
  .g .track{width:168px;height:19px;background:var(--win);display:block;flex:none;padding:3px;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .g .fill{display:block;height:100%;transition:width .6s steps(12,end);
    background:repeating-linear-gradient(90deg,var(--nav) 0 9px,transparent 9px 11px)}
  .g[data-k=e] .fill{background:repeating-linear-gradient(90deg,var(--teal) 0 9px,transparent 9px 11px)}
  .g[data-k=s] .fill{background:repeating-linear-gradient(90deg,var(--maro) 0 9px,transparent 9px 11px)}
  .g .val{font-weight:bold;font-size:16px;width:3ch;text-align:right;font-variant-numeric:tabular-nums}
  .g.low .nm{color:var(--maro);font-weight:bold}
  .g.low .nm:after{content:" (!)"}
  .chip{position:absolute;right:0;font-weight:bold;font-size:16px;opacity:0;pointer-events:none;color:var(--grn)}
  .chip.dn{color:var(--maro)}
  .chip.go{animation:fl 1.7s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translateY(5px)}14%{opacity:1}72%{opacity:1;transform:translateY(-9px)}100%{opacity:0;transform:translateY(-16px)}}

  /* ---------- ZONE DE TRAVAIL ---------- */
  .paper{flex:1;background:var(--win);overflow:auto;padding:clamp(16px,3.4vh,38px) clamp(18px,3vw,44px);min-height:0;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}

  .kick{font-size:clamp(12px,1.8vh,14.5px);letter-spacing:.06em;color:var(--gray);margin-bottom:clamp(12px,2.6vh,26px);text-transform:uppercase}
  .kick b{color:var(--maro);font-weight:bold}

  h1{font-size:clamp(18px,min(2.6vw,3.9vh),33px);font-weight:bold;line-height:1.3;margin:0 0 28px;max-width:26ch;color:var(--nav)}
  h2{font-size:clamp(16px,min(2vw,3vh),25px);font-weight:bold;line-height:1.35;margin:0 0 20px;max-width:30ch;color:var(--nav)}
  h3{font-size:16px;font-weight:bold;margin:0 0 6px;color:var(--nav)}

  .sit{font-weight:bold;font-size:clamp(17px,min(2.4vw,3.7vh),30px);line-height:1.38;margin:0 0 clamp(16px,3.4vh,36px);max-width:38ch}
  .sit.sm{font-weight:normal;font-size:clamp(14px,min(1.5vw,2.2vh),19px);line-height:1.45;color:var(--ink2);max-width:58ch;margin:0 0 14px}
  .choice{font-size:15px;font-weight:bold;color:var(--maro);margin:0 0 28px}
  .txt{font-size:clamp(15px,min(1.7vw,2.5vh),21px);line-height:1.5;margin:0 0 clamp(9px,1.6vh,16px);max-width:52ch}
  .src{font-size:14.5px;line-height:1.55;color:var(--gray);max-width:60ch;margin:0}
  .cur{animation:bl 1.06s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* ---------- CHOIX : liste à puces radio ---------- */
  .vote{display:flex;flex-direction:column;gap:clamp(4px,.9vh,7px);max-width:740px}
  .vote.row{flex-direction:row;flex-wrap:wrap;gap:8px}
  .vote.row .opt{width:auto;flex:0 0 auto}
  .opt{display:flex;align-items:flex-start;gap:13px;text-align:left;cursor:pointer;width:100%;
    background:var(--face);padding:clamp(7px,1.5vh,13px) 15px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .opt:hover{background:var(--face2)}
  .opt:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}
  .opt:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
  .opt .key{width:15px;height:15px;border-radius:50%;background:var(--win);flex:none;margin-top:5px;
    display:grid;place-items:center;font-size:0;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .opt:hover .key:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--shad)}
  .opt .t{font-weight:bold;font-size:clamp(15px,min(1.6vw,2.4vh),20px);line-height:1.35;flex:none}
  .opt .d{font-size:clamp(13px,min(1.35vw,2vh),17px);color:var(--ink2);line-height:1.4}
  .opt .t:after{content:attr(data-k);font-weight:normal;color:var(--gray);font-size:14px}

  /* ---------- BOÎTE DE DIALOGUE ---------- */
  .backdrop{position:fixed;inset:0;z-index:48;background:rgba(0,0,0,.18)}
  .rev{position:fixed;z-index:49;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(780px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--face);padding:3px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2),4px 4px 12px rgba(0,0,0,.4)}
  .dtbar{display:flex;align-items:center;gap:8px;padding:3px 3px 3px 6px;
    background:linear-gradient(90deg,var(--nav) 0%,#3A6EA5 62%,var(--nav2) 100%);color:#fff}
  .dtbar span{font-weight:bold;font-size:15px;flex:1}
  .dbody{padding:24px 26px 20px;overflow-y:auto;display:flex;gap:18px;align-items:flex-start}
  .dico{width:34px;height:34px;flex:none;margin-top:3px;display:grid;place-items:center;
    font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:25px;color:#fff;
    background:var(--nav);border-radius:50%}
  .dico.warn{background:#C8A200;color:#000;border-radius:0;
    clip-path:polygon(50% 0,100% 100%,0 100%);font-style:normal;font-size:19px;align-items:end}
  .dmain{flex:1;min-width:0}
  .dfoot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 14px}

  .punch{font-weight:bold;font-size:clamp(20px,2.1vw,26px);line-height:1.35;margin:0 0 16px;max-width:32ch}
  .dl{display:flex;gap:22px;flex-wrap:wrap;font-size:16px;font-weight:bold}
  .dl .gp{color:var(--grn);flex:none}
  .dl .neg{color:var(--maro);flex:none}
  .dl .nil{color:var(--gray)}
  .lbl{font-size:13.5px;color:var(--gray);display:block;margin-bottom:6px}
  .why{font-size:17px;line-height:1.55;max-width:56ch;margin:0}
  .q{font-size:clamp(18px,1.9vw,22px);font-weight:bold;line-height:1.4;color:var(--maro);max-width:34ch;margin:0}

  .discs{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
  .btn,.disc,.sbtn{background:var(--face);padding:8px 16px;cursor:pointer;font-size:16px;min-width:96px;text-align:center;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .btn:hover,.disc:hover,.sbtn:hover{background:var(--face2)}
  .btn:active,.disc:active,.sbtn:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}
  .btn:focus-visible,.disc:focus-visible,.sbtn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
  .btn[disabled]{color:var(--shad);text-shadow:1px 1px 0 var(--lite);cursor:default}
  .btn.def{box-shadow:0 0 0 1px var(--ink),inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2);font-weight:bold}
  .disc{min-width:0;font-size:15px}
  .disc.on{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2);background:var(--face2);font-weight:bold}
  .dbox{margin-top:18px;padding:14px;background:var(--face2);
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .after{margin-top:34px}

  /* ---------- ÉCHELLES ---------- */
  .rungs{list-style:none;padding:0;margin:0;max-width:830px}
  .rung{padding:clamp(7px,1.5vh,15px) 0;border-bottom:1px solid #D8D4CC}
  .rung .top{display:flex;gap:14px;align-items:baseline}
  .rung .no{font-size:14px;color:var(--gray);flex:none;min-width:22px}
  .rung .tx{font-weight:bold;font-size:clamp(14px,min(1.8vw,2.3vh),23px);line-height:1.4}
  .rung.past .tx{font-weight:normal;color:var(--ink2)}
  .rung .vb{margin:12px 0 0 36px}
  .rung .verdict{font-size:15px;font-weight:bold;color:var(--maro);margin:10px 0 0 36px}
  .rungs.tight .rung{padding:8px 0}
  .rungs.tight .tx{font-weight:normal;font-size:16.5px;line-height:1.35;color:var(--ink2)}
  .rungs.tight .vd{font-size:14px;font-weight:bold;color:var(--maro);margin-left:auto;padding-left:18px;white-space:nowrap;flex:none}

  .vb{display:flex;gap:8px;flex-wrap:wrap}
  .vb.set .sbtn{color:var(--shad);text-shadow:1px 1px 0 var(--lite);pointer-events:none}
  .vb.set .sbtn.on{color:var(--ink);text-shadow:none;font-weight:bold;
    box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}

  /* ---------- LISTES ---------- */
  .mini{list-style:none;padding:8px 10px;margin:0 0 28px;max-width:760px;background:var(--face2);
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .mini li{display:flex;gap:12px;align-items:baseline;padding:4px 0}
  .mini b{font-size:14px;color:var(--gray);font-weight:normal;flex:none}
  .mini span{font-size:16.5px;line-height:1.35;color:var(--ink2)}
  .mini .emp{color:var(--shad);font-style:italic}

  .plain{list-style:none;padding:0;margin:0;max-width:56ch}
  .plain li{padding:clamp(7px,1.5vh,15px) 0;border-bottom:1px solid #D8D4CC}
  .plain p{margin:0;font-size:17px;line-height:1.55}

  .prep{margin:0 0 8px;padding:0 0 0 28px;max-width:52ch}
  .prep li{font-size:clamp(14px,min(1.6vw,2.3vh),21px);line-height:1.45;margin-bottom:clamp(4px,1vh,9px)}
  .prep li::marker{color:var(--nav);font-weight:bold}

  .teams{list-style:none;padding:0;margin:24px 0 0;max-width:840px;background:var(--win)}
  .teams li{display:flex;gap:14px;align-items:baseline;padding:10px 12px}
  .teams li:nth-child(odd){background:var(--face2)}
  .teams .eq{font-size:14.5px;font-weight:bold;color:var(--nav);min-width:118px}
  .teams .dn{font-size:18px;font-weight:bold}
  .teams .tg{font-size:14px;color:var(--gray);margin-left:auto}

  /* ---------- LOIS ---------- */
  .laws{max-width:820px;margin-top:22px}
  .lawrow{display:flex;align-items:center;gap:13px;padding:6px 0}
  .lawrow .n{font-size:15px;font-weight:bold;color:var(--nav);flex:none;min-width:58px}
  .lawrow input{flex:1;background:var(--win);border:none;color:var(--ink);
    font-family:inherit;font-weight:bold;font-size:clamp(17px,1.8vw,21px);padding:9px 11px;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .lawrow input:focus{outline:1px dotted var(--ink);outline-offset:-4px}
  .lawrow input::placeholder{color:var(--shad);font-weight:normal;font-style:italic}
  .lawlist{list-style:none;padding:0;margin:0;max-width:820px;background:var(--win)}
  .lawlist li{display:flex;gap:14px;align-items:baseline;padding:10px 12px}
  .lawlist li:nth-child(odd){background:var(--face2)}
  .lawlist b{font-size:14.5px;color:var(--nav);flex:none}
  .lawlist span{font-weight:bold;font-size:clamp(16.5px,1.8vw,21px);line-height:1.4}
  .lawlist .emp{color:var(--shad);font-weight:normal;font-style:italic;font-size:16px}

  /* ---------- BILAN ---------- */

  /* ---------- IMPRESSION ---------- */

<script>
(function(){
  "use strict";
  var DATA = {"steps":[{"t":"boot"},{"t":"act","k":"ROUND 1 / 2","h":"Lancer ou pas","txt":"Cinq produits sur la table. Une minute de débat, un vote à main levée, puis la conséquence. Elle dépend de votre choix, pas du hasard.","src":"Touches A, B et C pour voter. Flèches pour avancer. Le chrono démarre tout seul à chaque question."},{"t":"card","id":"cv","kick":"ROUND 1 · QUESTION 1 — LE TRI DES CV","sit":"Votre IA trie 15 000 CV par an. Elle a appris sur dix ans de recrutements de l'entreprise.","opts":[{"t":"GO","g":{"p":18,"s":-22},"why":"Vous gagnez beaucoup de temps. Vous perdez PEOPLE parce que 15 000 personnes par an sont triées par un outil que personne n'a vérifié, et qu'aucune ne saura pourquoi elle a été écartée.","punch":"LE CV DE MOHAMMED N'EST JAMAIS ARRIVÉ SUR LE BUREAU.","txt":"Une étude de l'Université de Washington a testé ces outils sur 3 millions de CV. Les prénoms perçus comme blancs sont préférés 85 fois sur 100. Les prénoms d'hommes noirs ne sortent presque jamais en tête. L'outil ne prévient personne : il rend une liste propre et bien classée.","src":"Université de Washington, 2024.","q":"Combien de temps faut-il pour voir une discrimination qui ne laisse aucune trace ?"},{"t":"GO IF","g":{"p":10,"s":-6},"why":"Moins de PROFIT : la condition coûte deux salaires et un tiers du gain. PEOPLE baisse quand même, parce que le tri automatique continue, il est juste surveillé.","punch":"DITES LA CONDITION. MAINTENANT, À VOIX HAUTE.","txt":"Le labo choisit : un contrôle des biais par quelqu'un d'extérieur, la décision finale prise par un humain, et le droit pour le candidat de demander un réexamen. Le gain de temps passe de 70 % à 40 %, et deux personnes y passent leurs journées.","q":"Quelqu'un d'extérieur peut-il vérifier votre condition ? Sinon ce n'est pas une condition."},{"t":"NO GO","g":{"p":-6,"s":4},"why":"PROFIT baisse : ne rien faire coûte des parts de marché. PEOPLE monte peu, et c'est voulu : vous n'avez pas réglé le biais, vous avez refusé de le multiplier par 15 000.","punch":"VOTRE CONCURRENT LE LANCE TROIS MOIS PLUS TARD.","txt":"Il prend le marché. Vos 15 000 candidats restent jugés par des humains, qui discriminent aussi, les tests de recrutement le montrent en Belgique depuis vingt ans. Mais un dossier à la fois.","q":"Refuser, est-ce protéger les gens, ou refuser de voir que le problème existait déjà ?"}],"pw":"prompt","lk":"ROUND 1 · QUESTION 1"},{"t":"card","id":"diag","kick":"ROUND 1 · QUESTION 2 — LE DIAGNOSTIC","sit":"Une IA repère certains cancers onze mois plus tôt que les médecins. Personne ne sait expliquer comment elle décide.","opts":[{"t":"GO","g":{"p":16,"s":-14},"why":"PROFIT monte : le gain se compte en vies. PEOPLE baisse : il n'y a plus personne à qui demander pourquoi, donc plus personne de responsable.","punch":"C'EST VOTRE MÈRE. LE SYSTÈME S'EST TROMPÉ. PERSONNE NE SAIT POURQUOI.","txt":"Elle a subi un traitement lourd pour une tumeur qu'elle n'avait pas. Vous demandez sur quoi la machine s'est basée. La réponse honnête : sur des millions de calculs, et non, on ne peut pas les lire. La même année, le même outil a sauvé trois cents personnes.","q":"Les trois cents vies sauvées justifient-elles celle-là ? Répondez comme gouvernement. Puis comme fils ou fille."},{"t":"GO IF","g":{"p":9,"s":4},"why":"PEOPLE remonte : on sait qui est responsable, donc on peut contester. PROFIT baisse des trois mois perdus, et c'est le prix du contrôle humain.","punch":"L'IA PROPOSE, LE MÉDECIN SIGNE.","txt":"Le gain passe de onze à huit mois, le temps que le médecin valide. En échange, il y a un nom au bas de la décision, et quelqu'un à qui parler.","q":"Un médecin qui signe sans pouvoir vérifier : vraie garantie, ou signature pour se rassurer ?"},{"t":"NO GO","g":{"p":-6,"s":-4},"why":"Les deux jauges baissent, seul cas du round. Ne rien faire n'est pas neutre : les victimes sont invisibles, donc personne n'est jamais tenu pour responsable.","punch":"NE RIEN FAIRE TUE AUSSI. ÇA NE FAIT JUSTE PAS LA UNE.","txt":"Onze mois de retard au diagnostic, pour tout le monde, chaque année, comme avant.","q":"Quelle preuve vous ferait changer d'avis ? Donnez un chiffre."}],"pw":"rctfc","lk":"ROUND 1 · QUESTION 2"},{"t":"card","id":"tuteur","kick":"ROUND 1 · QUESTION 3 — LE TUTEUR IA","sit":"L'école remplace une partie du suivi des profs par un tuteur IA disponible jour et nuit. Toutes les conversations sont enregistrées et gardées cinq ans.","opts":[{"t":"GO","g":{"p":15,"s":-10},"why":"PROFIT monte : les étudiants progressent, c'est mesuré. PEOPLE baisse : vous venez de créer une base de données des fragilités de vos étudiants, et vous ne pourrez plus l'effacer.","punch":"EN UN AN, L'ÉCOLE A UN DOSSIER SUR CHACUN DE SES ÉTUDIANTS.","txt":"Ce qu'il ne comprend pas, ce qu'il n'ose pas demander en classe, les cours qu'il abandonne, les mots qu'il emploie quand il panique avant un examen, et ce qu'il écrit à trois heures du matin. Tout est enregistré et gardé cinq ans. Cette base est accessible à l'éditeur du logiciel, à son hébergeur, à ses sous-traitants, et à toute personne qui en obtiendra un accès d'ici là. L'étudiant, lui, croyait parler à un tuteur.","q":"Qu'avez-vous déjà écrit à une IA que vous ne diriez pas à un prof ?"},{"t":"GO IF","g":{"p":9,"s":-2},"why":"PROFIT baisse : les données font progresser l'outil, et vous venez de les rationner. PEOPLE tient : la donnée qu'on ne garde pas ne peut pas fuiter.","punch":"VOUS ACCEPTEZ D'ÊTRE MOINS PERFORMANTS.","txt":"Conversations anonymes, effacées après trente jours, et le tuteur ne touche jamais aux notes. L'outil s'améliore plus lentement. Les étudiants l'utilisent plus, parce qu'ils lui font confiance.","q":"Qui, dans une école, a le pouvoir d'imposer ça à un fournisseur ?"},{"t":"NO GO","g":{"p":-5,"s":3},"why":"PEOPLE monte un peu : aucune donnée collectée, aucune fuite possible. PROFIT baisse : le système actuel a aussi des victimes, elles sont juste moins visibles.","punch":"CEUX QUI N'OSENT PAS LEVER LA MAIN CONTINUENT DE NE PAS OSER.","txt":"Il reste 180 étudiants par prof, deux semaines d'attente pour une correction, et neuf heures d'ouverture par jour.","q":"Le tuteur servait surtout à qui : aux meilleurs, ou à ceux qui n'osent pas parler ?"}],"pw":"itération","lk":"ROUND 1 · QUESTION 3"},{"t":"card","id":"agence","kick":"ROUND 1 · QUESTION 4 — L'AGENCE","sit":"Votre agence remplace 60 % de sa production visuelle par de l'IA. Cinq fois plus de visuels, prix divisés par trois, douze freelances sur vingt ne sont pas rappelés.","opts":[{"t":"GO","g":{"p":20,"s":-18},"why":"PROFIT explose. PEOPLE paie la disparition de la première marche du métier : une agence sans juniors est une agence sans seniors dans dix ans.","punch":"LE POSTE DE JUNIOR SUPPRIMÉ, DANS CINQ ANS, C'EST LE VÔTRE.","txt":"Stanford mesure en 2026 un écart d'emploi de 19 % pour les 22-25 ans dans les métiers les plus touchés par l'IA. Ce ne sont pas des licenciements : ce sont des postes qui ne s'ouvrent plus. Et les tâches supprimées sont celles sur lesquelles on apprenait le métier.","src":"Stanford Digital Economy Lab, août 2026.","q":"Si plus personne ne recrute de junior, qui sera directeur artistique en 2035 ?"},{"t":"GO IF","g":{"p":12,"s":-5},"why":"Vous gardez l'essentiel du gain et une porte d'entrée dans le métier. En échange, il faut former à un autre métier, et ça coûte.","punch":"LE JUNIOR NE PRODUIT PLUS. IL PILOTE ET IL CORRIGE.","txt":"Trois fois plus de visuels au lieu de cinq, mais votre style reste reconnaissable. C'est exactement ce que les clients paient plus cher quand tout le monde a les mêmes outils.","q":"Citez trois compétences que ce nouveau junior doit avoir et que le programme ne donne pas."},{"t":"NO GO","g":{"p":-8,"s":6},"why":"PROFIT chute : vous refusez un gain que le marché a déjà mis dans ses prix. PEOPLE monte : vingt freelances gardent leur revenu.","punch":"TROIS CLIENTS PARTENT CHEZ UNE AGENCE TROIS FOIS MOINS CHÈRE.","txt":"Deux reviennent six mois plus tard : la qualité ne suivait pas. Le fait main se défend, mais il faut des clients capables de voir la différence et prêts à la payer.","q":"Quel client paie encore trois fois le prix pour du fait main ? Décrivez-le."}],"pw":"pairi daiza","lk":"ROUND 1 · QUESTION 4"},{"t":"card","id":"usine","kick":"ROUND 1 · QUESTION 5 — L'USINE","sit":"Une IA très gourmande en électricité réduit de 18 % les déchets d'une usine. Elle consomme autant que 400 foyers et évite 12 000 tonnes de déchets par an.","opts":[{"t":"GO","g":{"p":14,"e":4},"why":"PLANET monte, et ça surprend toujours : cette jauge ne mesure pas la consommation, elle mesure le solde. Une IA qui consomme beaucoup et évite davantage améliore le bilan.","punch":"L'IA POLLUE. ET LE BILAN RESTE POSITIF.","txt":"400 foyers d'électricité contre 12 000 tonnes de déchets évités. Le solde est bon, et il est mesurable. À condition de le recalculer chaque année, parce que les modèles grossissent plus vite que leurs gains.","q":"Que se passe-t-il le jour où il faut doubler la taille du modèle pour gagner deux points ?"},{"t":"GO IF","g":{"p":8,"e":8},"why":"Meilleur résultat du cas, parce que c'est le seul où quelqu'un a mesuré la situation de départ. PROFIT paie les six mois de retard.","punch":"VOUS MESUREZ AVANT DE BRANCHER.","txt":"Bilan complet avant le déploiement, et hébergement sur un réseau électrique peu carboné. Le projet démarre six mois plus tard, avec un impact deux fois meilleur.","q":"Pourquoi presque personne ne mesure la situation de départ ?"},{"t":"NO GO","g":{"p":-5,"e":-6},"why":"PLANET baisse : votre refus n'a pas supprimé le problème, il l'a sorti du calcul. « IA = pollution » vient de vous coûter des points sur la jauge que vous vouliez protéger.","punch":"VOUS AVEZ REFUSÉ POUR L'ENVIRONNEMENT. L'ENVIRONNEMENT Y PERD.","txt":"Les 12 000 tonnes de déchets sont toujours là, chaque année.","q":"Quelle information vous aurait fait voter autrement ? Vous l'aviez à l'écran."}],"pw":"ephec","lk":"ROUND 1 · QUESTION 5"},{"t":"act","k":"ROUND 1 / 2","h":"Quatre chiffres","txt":"On arrête les opinions. Quatre chiffres à situer, trois lieux réels. La classe annonce un ordre de grandeur, puis on vérifie.","src":"Bonne réponse : PLANET +6. Mauvaise réponse : aucun point, et c'est tout l'intérêt."},{"t":"card","id":"f1","kick":"ROUND 1 · FAIT 1 — SAINT-GHISLAIN","sit":"Le data center de Google à Saint-Ghislain, à une heure d'ici. Combien d'eau consomme-t-il par an ?","opts":[{"t":"Comme 1 000 ménages","g":{},"why":""},{"t":"Comme 10 700 ménages","g":{"e":6},"why":"","right":true},{"t":"Comme 100 000 ménages","g":{},"why":""}],"sh":{"punch":"UN MILLION DE MÈTRES CUBES PAR AN. CHIFFRE PUBLIÉ PAR GOOGLE.","txt":"Soit ce que consomment 10 700 ménages wallons, pour un seul site. Maintenant attaquez la comparaison, parce qu'elle est fragile : 96 % de cette eau n'est pas potable, elle vient du canal voisin. 70 % s'évapore, 30 % repart dans la rivière à une température proche. Un ménage, lui, boit de l'eau du robinet. Le chiffre est juste, la comparaison est bancale.","src":"Rapport environnemental de Google, données 2022, repris par la presse belge en juillet 2023.","q":"Si l'eau du canal ne vaut pas l'eau du robinet, pourquoi la Wallonie a-t-elle quand même refusé le pompage dans la Sambre ?"},"ok":"La classe a trouvé le bon ordre de grandeur. Mais le vrai point est ailleurs : un chiffre juste peut porter une comparaison fausse. C'est le métier de ceux qui écrivent les communiqués comme de ceux qui écrivent les tracts.","ko":"Aucun point. Ce n'est pas grave : sur ces chiffres, l'intuition de groupe se trompe presque toujours, dans un sens ou dans l'autre.","pw":"mso","lk":"ROUND 1 · FAIT 1"},{"t":"card","id":"f2","kick":"ROUND 1 · FAIT 2 — LA SAMBRE, AOÛT 2026","sit":"Google demande à pomper 600 m³ d'eau par heure dans la Sambre pour refroidir son data center IA à Aiseau-Presles. 400 emplois annoncés. Que décide la Wallonie ?","opts":[{"t":"Elle accepte","g":{},"why":""},{"t":"Elle accepte sous conditions","g":{},"why":""},{"t":"Elle refuse","g":{"e":6},"why":"","right":true}],"sh":{"punch":"REFUS.","txt":"En août 2026, le ministre wallon refuse le permis. Motif : les canicules à répétition et le risque de manquer d'eau. L'été d'avant, il avait déjà fallu pomper 28 000 m³ ailleurs pour maintenir les niveaux. Voilà la réponse à la question précédente : l'eau de rivière n'est pas de l'eau potable, mais en canicule elle manque quand même, à l'agriculture, aux bateaux et aux poissons.","src":"Presse belge, 15-17 août 2026. Google a annoncé en octobre 2025 cinq milliards d'euros d'investissement en Belgique jusqu'en 2027.","q":"Quatre cents emplois contre une rivière en canicule. Vous décidez quoi, et devant qui l'assumez-vous ?"},"ok":"La classe avait vu venir la décision. Savoir lire un arbitrage public fait partie du métier : ce refus était prévisible pour qui suit les dossiers d'eau depuis deux étés.","ko":"Aucun point. Presque toutes les classes répondent « elle accepte », parce que 400 emplois pèsent lourd. C'est justement l'intérêt du cas.","pw":"modalisa","lk":"ROUND 1 · FAIT 2"},{"t":"card","id":"f3","kick":"ROUND 1 · FAIT 3 — L'IRLANDE","sit":"En Irlande, quelle part de l'électricité du pays part dans les data centers ?","opts":[{"t":"5 %","g":{},"why":""},{"t":"12 %","g":{},"why":""},{"t":"23 %","g":{"e":6},"why":"","right":true}],"sh":{"punch":"23 %. PRESQUE AUTANT QUE TOUS LES FOYERS IRLANDAIS RÉUNIS.","txt":"Chiffre publié par l'office statistique irlandais en juillet 2026, pour l'année 2025. Dublin a gelé les nouveaux raccordements au réseau. Dans le monde, les data centers pèsent environ 1,5 % de l'électricité : la moyenne rassure, la réalité locale non. Le problème n'est pas la quantité, c'est la concentration.","src":"Office statistique irlandais, juillet 2026 ; AIE, Energy and AI, 2025.","q":"Qu'est-ce qui attire ces installations dans un pays, et la Belgique coche combien de cases ?"},"ok":"La classe a compris que la question environnementale de l'IA est d'abord une question de territoire et de réseau électrique, pas une moyenne mondiale.","ko":"Aucun point. La plupart des classes répondent 5 %, parce que la moyenne mondiale est ce qu'on entend le plus souvent.","pw":"desk","lk":"ROUND 1 · FAIT 3"},{"t":"card","id":"f4","kick":"ROUND 1 · FAIT 4 — LE PARADOXE","sit":"Une requête IA consomme aujourd'hui à peu près autant qu'une recherche sur le web : les modèles ont été beaucoup optimisés. Alors pourquoi la consommation totale double-t-elle ?","opts":[{"t":"Les chiffres publiés sont faux","g":{},"why":""},{"t":"C'est devenu si peu cher qu'on en fait mille fois plus","g":{"e":6},"why":"","right":true},{"t":"Les modèles restent trop gourmands","g":{},"why":""}],"sh":{"punch":"L'EFFET REBOND.","txt":"Quand une technologie devient moins chère, on l'utilise beaucoup plus, et le total augmente malgré des gains réels par requête. C'est pour ça que « l'IA devient plus sobre » et « l'IA consomme de plus en plus » sont vrais en même temps. L'AIE attend environ 945 TWh pour les data centers en 2030, contre 415 TWh en 2024.","src":"AIE, Energy and AI, 2025.","q":"Citez une innovation qui a rendu un usage plus efficace et fait exploser la consommation totale. Le marketing en est plein."},"ok":"La classe connaît le mécanisme que la plupart des campagnes sur l'IA verte passent sous silence. Un marketeur qui le connaît ne se fait pas avoir par une promesse d'efficacité.","ko":"Aucun point. C'est le piège classique : on cherche le coupable dans la technologie, alors qu'il est dans l'usage.","pw":"rag","lk":"ROUND 1 · FAIT 4"},{"t":"act","k":"ROUND 2 / 2","h":"Où est la limite ?","txt":"Quatre séries de six étapes. Chacune part de quelque chose que tout le monde fait et monte jusqu'à quelque chose que personne ne défendrait. La classe tranche à chaque étape.","src":"Il n'y a pas de bonne réponse. Il y a une limite, et elle doit pouvoir se dire à voix haute."},{"t":"steps","id":"image","kick":"ROUND 2 · SÉRIE 1 — L'IMAGE","intro":"On commence par quelque chose que tout le monde fait. À chaque étape, la classe tranche : OK, PAS OK, ou ÇA DÉPEND.","rungs":["Vous retouchez une photo de vous avant de la poster.","Vous utilisez un filtre qui change la forme de votre visage et de votre corps.","Vous retouchez la photo d'une amie, sans lui dire, avant de la poster.","Vous mettez le visage d'un camarade sur le corps de quelqu'un d'autre, habillé, pour faire rire le groupe.","Vous générez une image dénudée d'une personne réelle de votre classe. Vous ne la montrez à personne.","Vous l'envoyez à un seul ami."],"q":"Entre l'étape 4 et l'étape 5, qu'est-ce qui a changé ? Dites-le sans utiliser le mot « nu ».","pw":"projet","lk":"ROUND 2 · SÉRIE 1"},{"t":"steps","id":"texte","kick":"ROUND 2 · SÉRIE 2 — LE TEXTE","intro":"Même exercice, sur quelque chose que vous faites tous les jours : votre propre travail écrit.","rungs":["L'IA corrige votre orthographe.","L'IA reformule vos paragraphes pour qu'ils soient plus clairs.","Vous donnez vos idées, l'IA écrit les paragraphes.","Vous donnez le sujet, l'IA écrit le plan et le texte, vous vérifiez tout.","L'IA écrit tout, vous ne relisez pas.","Vous achetez un travail écrit par quelqu'un d'autre."],"q":"Votre limite est à quelle étape ? Et sauriez-vous prouver que vous étiez du bon côté ?","pw":"challenge","lk":"ROUND 2 · SÉRIE 2"},{"t":"steps","id":"voix","kick":"ROUND 2 · SÉRIE 3 — LA VOIX","intro":"Trois secondes d'audio suffisent. Vous en publiez plusieurs heures par mois.","rungs":["Vous clonez votre propre voix pour raconter une vidéo.","Vous clonez la voix d'un acteur, qui a signé un contrat et qui est payé.","Vous clonez la voix d'un chanteur mort, pour un hommage.","Vous clonez la voix de votre prof pour une blague dans le groupe de classe.","Vous clonez la voix de votre mère pour piéger votre père.","Quelqu'un clone votre voix pour demander de l'argent à votre mère."],"q":"À partir de quelle étape l'accord devient-il obligatoire ? Et   var STEPS = DATA.steps;

  function norm(x){return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g,"");}
  function isLocked(i){var s=STEPS[i];return !!(s&&s.pw&&!st.unlocked[i]);}
  function e(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  var KEY=["A","B","C"];

  function buildG(){
    var h="";["p","e","s"].forEach(function(k){
      h+='<div class="g" data-k="'+k+'" id="g-'+k+'"><span class="nm">'+NM[k]+
         '</span><span class="track"><span class="fill" id="b-'+k+'"></span></span>'+
         '<span class="val" id="v-'+k+'"></span><span class="chip" id="c-'+k+'"></span></div>';
    });$gz.innerHTML=h;
  }
  function paintG(){
    var lo=false;
    ["p","e","s"].forEach(function(k){
      var v=st.g[k];
      document.getElementById("b-"+k).style.width=Math.max(0,Math.min(100,v))+"%";
      document.getElementById("v-"+k).textContent=v;
      var l=v<30;if(l)lo=true;
      document.getElementById("g-"+k).classList.toggle("low",l);
    });
    $stat.textContent=lo?"Statut : ALERTE":"Statut : calme";
  }
  function delta(d){
    ["p","e","s"].forEach(function(k){
      var v=(d||{})[k]||0;if(!v)return;
      st.g[k]=Math.max(0,Math.min(100,st.g[k]+v));
      var c=document.getElementById("c-"+k);
      c.textContent=(v>0?"+":"")+v;c.className="chip "+(v>0?"up":"dn");
      void c.offsetWidth;c.classList.add("go");
    });
    paintG();
  }
  function dl(d){
    var o=[];
    ["p","e","s"].forEach(function(k){
      var v=(d||{})[k]||0;
      if(v)o.push('<span class="'+(v>0?"gp":"neg")+'">'+NM[k]+" "+(v>0?"+":"\u2212")+Math.abs(v)+"</span>");
    });

  /* ---------- chrono : gros, et il part tout seul ---------- */
  var T={l:0,id:null,run:false};
  function f2(x){var m=Math.floor(x/60),r=x%60;return m+":"+(r<10?"0":"")+r;}
  function stopT(){if(T.id){clearInterval(T.id);T.id=null;}T.run=false;$tm.classList.remove("run");}
  function setT(sec){
    stopT();T.l=sec||0;
    $tm.className="clock"+(sec?"":" off");
    $tm.textContent=sec?f2(sec):"--:--";
  }
  function startT(){
    if(!T.l||T.run)return;
    T.run=true;$tm.classList.add("run");
    T.id=setInterval(function(){
      T.l--;$tm.textContent=f2(Math.max(0,T.l));
      if(T.l<=0){stopT();$tm.className="clock out";bp();}
    },1000);
  }
  function togT(){if(T.run)stopT();else startT();}
  function bp(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    var c=new A(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=620;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);o.stop(c.currentTime+.85);}catch(err){}}

  /* ---------- la conséquence s'ouvre en boîte de dialogue ---------- */

         (src?'<p class="src">'+e(src)+"</p>":"")+"</div>";

        '</span><span class="tx">'+e(s.rungs[i])+"</span></div>"+

  function line(v){

        dl(l.g).replace('class="dl"','class="dl" style="gap:12px;margin:0;font-size:14px"')+"</td></tr>";
    }).join("")||'<tr><td colspan="4">Rien enregistr&eacute;.</td></tr>';
    return '<div class="kick">'+e(s.k)+" &middot; score = la jauge la plus basse ("+weak+")</div>"+
      '<p class="big '+v[0]+'">'+mn+"</p>"+
      '<p class="vn '+v[0]+'">'+v[1]+"</p>"+
      '<p class="txt">'+v[2]+"</p>"+
      '<div class="fin"><span>PROFIT '+g.p+"</span><span>PLANET "+g.e+"</span><span>PEOPLE "+g.s+"</span></div>"+
      '<div class="kick" style="margin:32px 0 10px">Toutes vos d&eacute;cisions</div>'+
      '<div class="scr"><table><thead><tr><th>ROUND</th><th>CAS</th><th>CHOIX</th><th>IMPACT</th></tr></thead><tbody>'+rows+"</tbody></table></div>"+
      '<p class="q">Regardez la ligne qui vous a co&ucirc;t&eacute; le plus cher. Au moment du vote, quelqu\'un l\'avait-il vu venir ?</p>';
  };

  R.end=function(){
    return '<div class="end"><h2>L\'IA n\'est pas seulement une technologie.</h2>'+
      "<p>Chaque d&eacute;cision sur l\'IA est aussi un choix sur les gens, le pouvoir et les ressources.</p>"+
      '<p class="src">Fin de la partie</p></div>';
  };

  /* ---------- verrou ---------- */
  function lockScreen(s){
    var h='<div class="kick">'+e(s.lk)+'</div><div class="lockbox">'+
      "<h1>&Eacute;cran verrouill&eacute;.</h1>"+
      '<p class="txt">Tapez le mot de passe donn&eacute; par le professeur, puis Entr&eacute;e.</p>'+
      '<div class="lawrow"><span class="n">Mot de passe</span>'+
        '<input type="text" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Mot de passe"></div>'+
      '<div class="lockrow"><button class="btn def" data-act="unlock">D&eacute;verrouiller</button></div>'+
      '<p class="pwmsg" id="pwmsg" role="status"></p>';
    if(PRES) h+='<div class="pres"><span class="lbl">Pr&eacute;sentateur</span>'+
      '<div class="lockrow"><button class="btn" data-act="showpw">Afficher le mot</button>'+
      '<button class="btn" data-act="forceunlock">D&eacute;verrouiller cet &eacute;cran</button></div>'+
      '<span class="pwbig" id="pwbig" hidden>'+e(s.pw)+"</span></div>";
    return h+"</div>";
  }
  function tryUnlock(){
    var s=STEPS[st.i],inp=document.getElementById("pw"),msg=document.getElementById("pwmsg");
    if(!s||!s.pw||!inp)return;
    if(norm(inp.value)===norm(s.pw)){st.unlocked[st.i]=1;render();return;}
    msg.textContent=inp.value.trim()?"Mot de passe incorrect.":"Tapez d\'abord le mot de passe.";
    inp.select();
  }

  /* ---------- récapitulatif imprimable ---------- */
  function pD(d){var o=[];["p","e","s"].forEach(function(k){var v=(d||{})[k]||0;
    if(v)o.push(NM[k]+" "+(v>0?"+":"\u2212")+Math.abs(v));});return o.length?o.join(" \u00b7 "):"aucun point";}
  /* mode "full" : tout le jeu, verrous ignorés, toutes les options et leurs points.
     mode "played" : seulement ce que la classe a débloqué. */
  function buildPrint(mode){
    var FULL=(mode==="full");
    var g=st.g,mn=Math.min(g.p,g.e,g.s),h="";
    h+="<h1>AI Lab 2035 \u2014 r\u00e9capitulatif de la partie</h1>"+
      '<p class="meta">'+new Date().toLocaleDateString("fr-BE")+" \u00b7 score final "+mn+
      " \u00b7 PROFIT "+g.p+" \u00b7 PLANET "+g.e+" \u00b7 PEOPLE "+g.s+
      "<br>&copy; \u00c9quipe Prompt Engineering 26-27</p>";
    if(FULL)h+='<p class="meta"><b>Version compl\u00e8te : toutes les questions, toutes les options et leurs points.</b> Mots de passe inclus.</p>';
    h+="<h2>Round 1 \u2014 lancer ou pas</h2>";
    STEPS.forEach(function(c,i){
      if(c.t!=="card"||c.kick.indexOf("QUESTION")<0)return;
      if(!FULL&&!PRES&&isLocked(i))return;
      var d=st.done[c.id],o=d?c.opts[d.k]:null;
      h+='<div class="box"><h3>'+e(c.kick)+"</h3><p><b>"+e(c.sit)+"</b></p>"+
        (FULL?'<p class="sm">Mot de passe : '+e(c.pw)+"</p>":"");
      if(FULL){
        c.opts.forEach(function(x,n){
          h+="<p><b>"+"ABC".charAt(n)+"  "+e(x.t)+"</b> \u2014 "+pD(x.g)+(o&&o===x?"  [choix de la classe]":"")+"</p>"+
            (x.punch?"<p><b>"+e(x.punch)+"</b></p>":"")+(x.txt?"<p>"+e(x.txt)+"</p>":"")+
            (x.src?'<p class="sm">'+e(x.src)+"</p>":"")+
            "<p><i>Pourquoi ces points :</i> "+e(x.why)+"</p>"+(x.q?"<p><i>Question :</i> "+e(x.q)+"</p>":"");
        });
      } else {
        h+=(o?'<p class="pick">Choix : '+e(o.t)+" \u2014 "+pD(o.g)+"</p><p><b>"+e(o.punch)+"</b></p>"+
            (o.txt?"<p>"+e(o.txt)+"</p>":"")+(o.src?'<p class="sm">'+e(o.src)+"</p>":"")+
            "<p><i>Pourquoi ces points :</i> "+e(o.why)+"</p><p><i>Question :</i> "+e(o.q)+"</p>"
          :"<p><i>Non jou\u00e9.</i></p>");
      }
      h+="</div>";
    });
    h+="<h2>Round 1 \u2014 les quatre chiffres</h2>";
    STEPS.forEach(function(c,i){
      if(c.t!=="card"||c.kick.indexOf("FAIT")<0)return;
      if(!FULL&&!PRES&&isLocked(i))return;
      var d=st.done[c.id],o=d?c.opts[d.k]:null,good=c.opts.filter(function(x){return x.right;})[0];
      h+='<div class="box"><h3>'+e(c.kick)+"</h3><p><b>"+e(c.sit)+"</b></p>"+
        (FULL?'<p class="sm">Mot de passe : '+e(c.pw)+"</p>":"")+
        '<p class="pick">R\u00e9ponse de la classe : '+(o?e(o.t)+(o.right?" (juste)":" (\u00e0 c\u00f4t\u00e9)"):"non jou\u00e9")+
        " \u00b7 bonne r\u00e9ponse : "+e(good.t)+"</p>"+
        "<p><b>"+e(c.sh.punch)+"</b></p><p>"+e(c.sh.txt)+'</p><p class="sm">'+e(c.sh.src)+"</p>"+
        "<p><i>Question :</i> "+e(c.sh.q)+"</p></div>";
    });
    h+="<h2>Round 2 \u2014 o\u00f9 est la limite ?</h2>";
    STEPS.forEach(function(c,i){
      if(c.t!=="steps")return;
      if(!FULL&&!PRES&&isLocked(i))return;
      var v=st.rungs[c.id]||[];
      h+='<div class="box"><h3>'+e(c.kick)+" \u2014 "+e(v.length?line(v):"non jou\u00e9e")+"</h3>"+
        (FULL?'<p class="sm">Mot de passe : '+e(c.pw)+"</p>":"")+"<ol>"+
        c.rungs.map(function(r,n){return "<li>"+e(r)+(v[n]?" <b>["+VL[v[n]]+"]</b>":"")+"</li>";}).join("")+
        "</ol>"+(FULL?"<p><i>À poser à l'oral :</i> "+e(c.q)+"</p>":"")+"</div>";
    });
    h+="<h2>Toutes les d\u00e9cisions</h2><table><tr><th>Round</th><th>Cas</th><th>Choix</th><th>Impact</th></tr>";
    st.log.forEach(function(l){h+="<tr><td>"+e(l.ph)+"</td><td>"+e(l.nm)+"</td><td>"+e(l.ch)+"</td><td>"+pD(l.g)+"</td></tr>";});
    h+="</table>";
    h+='<h2>Sources</h2><p class="sm">Universit\u00e9 de Washington 2024 \u00b7 Stanford Digital Economy Lab 2026 \u00b7 AIE, Energy and AI 2025 \u00b7 Office statistique irlandais 2026 \u00b7 rapport environnemental de Google via la presse belge 2023 \u00b7 refus de pompage dans la Sambre, presse belge ao\u00fbt 2026 \u00b7 Liang et al., Patterns 2023 \u00b7 Deeptrace 2019 \u00b7 Frontiers, r\u00e9tractation de f\u00e9vrier 2024.</p>';
    document.getElementById("pdoc").innerHTML=h;
  }

  /* ---------- mise à l'échelle ---------- */
  var Z=1,NOFIT={bilan:1};
  function applyFit(){
    var fit=document.getElementById("fit");if(!fit)return;
    fit.style.zoom=Z;
    if(NOFIT[STEPS[st.i].t])return;
    var cs=getComputedStyle($s);
    var avail=$s.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4;
    for(var i=0;i<2;i++){
      var need=fit.getBoundingClientRect().height;
      if(need<=avail||need<=0)break;
      fit.style.zoom=Math.max(.6,parseFloat(fit.style.zoom)*(avail/need)*.99);
    }
  }
  function zoom(v){
    Z=Math.max(.8,Math.min(2.2,Math.round(v*100)/100));
    try{localStorage.setItem("lab_z",String(Z));}catch(err){}
    $pos.textContent="\u00c9cran "+(st.i+1)+" sur "+STEPS.length+"  \u00b7  Texte "+Math.round(Z*100)+" %";
    applyFit();
  }
  try{var z0=parseFloat(localStorage.getItem("lab_z"));if(z0>=.8&&z0<=2.2)Z=z0;}catch(err){}

  var TIMERS={card:60,steps:240};
  function render(){
    var s=STEPS[st.i],locked=isLocked(st.i);
    $pv.disabled=st.i===0;
    $nx.disabled=locked;
    $nx.textContent=st.i===STEPS.length-1?"Fin":"Suivant >";
    $s.innerHTML='<div id="fit">'+(locked?lockScreen(s):R[s.t](s))+"</div>";
    var dz=document.getElementById("dlgzone");dz.innerHTML="";
    var fit=document.getElementById("fit");
    [".backdrop",".rev"].forEach(function(sel){var el=fit.querySelector(sel);if(el)dz.appendChild(el);});
    $s.scrollTop=0;
    zoom(Z);
    /* le chrono part tout seul sur une question d&eacute;verrouill&eacute;e */
    if(locked){setT(0);var inp=document.getElementById("pw");if(inp&&!PRES)inp.focus();}
    else if(TIMERS[s.t]){
      if(!st.started[st.i]){st.started[st.i]=1;setT(TIMERS[s.t]);startT();}
    } else setT(0);
  }

  /* ---------- événements ---------- */
  function vote(k){
    var s=STEPS[st.i];
    if(s.t!=="card"||isLocked(st.i)||st.done[s.id]||!s.opts[k])return;
    delete st.closed[st.i];
    var o=s.opts[k];
    st.done[s.id]={k:k};
    st.log.push({ph:s.kick.indexOf("FAIT")>=0?"R1 fait":"R1",nm:s.kick.split("\u2014")[1].trim(),
      ch:o.t+(s.opts.filter(function(x){return x.right;})[0]?(o.right?" (juste)":" (\u00e0 c\u00f4t\u00e9)"):""),g:o.g});
    stopT();render();delta(o.g);
  }
  function rung(v){
    var s=STEPS[st.i];
    if(s.t!=="steps"||isLocked(st.i))return;
    st.rungs[s.id]=st.rungs[s.id]||[];
    if(st.rungs[s.id].length>=s.rungs.length)return;
    delete st.closed[st.i];
    st.rungs[s.id].push(v);
    if(st.rungs[s.id].length>=s.rungs.length)stopT();
    render();
  }

  document.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]");if(!b)return;
    var a=b.getAttribute("data-act");
    if(a==="vote"){vote(+b.getAttribute("data-k"));return;}
    if(a==="rung"){rung(b.getAttribute("data-v"));return;}
    if(a==="unlock"){tryUnlock();return;}
    if(a==="showpw"){var pb=document.getElementById("pwbig");
      if(pb){pb.hidden=!pb.hidden;b.textContent=pb.hidden?"Afficher le mot":"Masquer le mot";applyFit();}return;}
    if(a==="forceunlock"){st.unlocked[st.i]=1;render();return;}
    if(a==="print"){buildPrint(b.getAttribute("data-m")||"played");setTimeout(function(){try{window.print();}catch(err){}},80);return;}
    if(a==="closedlg"){st.closed[st.i]=1;render();return;}
    if(a==="opendlg"){delete st.closed[st.i];render();return;}
    if(a==="disc"){
      var root=b.closest(".rev")||$s;
      var t=b.getAttribute("data-t"),box=root.querySelector('[data-box="'+t+'"]'),open=box&&box.hidden;
      Array.prototype.forEach.call(root.querySelectorAll(".dbox"),function(x){x.hidden=true;});
      Array.prototype.forEach.call(root.querySelectorAll(".disc"),function(x){x.classList.remove("on");});
      if(box&&open){box.hidden=false;b.classList.add("on");}
      return;
    }
  });
  $s.addEventListener("keydown",function(ev){
    if(ev.target.id==="pw"&&ev.key==="Enter"){ev.preventDefault();tryUnlock();}
  });
  $s.addEventListener("input",function(ev){
    if(ev.target.id==="pw"){var m=document.getElementById("pwmsg");if(m)m.textContent="";}
  });

  $nx.addEventListener("click",function(){if(st.i<STEPS.length-1){st.i++;render();}});
  $pv.addEventListener("click",function(){if(st.i>0){st.i--;render();}});
  $tm.addEventListener("click",togT);
  $tm.addEventListener("keydown",function(ev){if(ev.key==="Enter")togT();});

  var $mb=document.getElementById("mbar"),openMenu=null;
  function shutMenus(){
    Array.prototype.forEach.call($mb.querySelectorAll(".mdrop"),function(d){d.hidden=true;});
    Array.prototype.forEach.call($mb.querySelectorAll(".mitem"),function(m){m.classList.remove("open");});
    openMenu=null;
  }
  function goFull(){try{if(document.fullscreenElement)document.exitFullscreen();
    else document.documentElement.requestFullscreen();}catch(e){}}
  function setPres(){
    document.querySelector(".ttl").innerHTML="AI Lab 2035 &mdash; Assistant de d&eacute;cision"+(PRES?"  [Pr&eacute;sentateur]":"");
    document.getElementById("mpres").innerHTML=PRES?"Quitter le mode pr&eacute;sentateur":"Mode pr&eacute;sentateur&hellip;";
  }
  function doReset(){
    if(!confirm("Recommencer ? Tous les votes seront effac\u00e9s."))return;
    st={i:0,g:{p:60,e:60,s:60},log:[],done:{},closed:{},unlocked:{},rungs:{},started:{}};
    paintG();render();
  }
  function doMenu(cmd){
    shutMenus();
    if(cmd==="print-played"||cmd==="print-full"){buildPrint(cmd==="print-full"?"full":"played");setTimeout(function(){try{window.print();}catch(e){}},80);return;}
    if(cmd==="zoom+"){zoom(Z+.1);return;}
    if(cmd==="zoom-"){zoom(Z-.1);return;}
    if(cmd==="fs"){goFull();return;}
    if(cmd==="reset"){doReset();return;}
    if(cmd==="presenter"){
      if(PRES){PRES=false;setPres();render();return;}
      var c=prompt("Code pr\u00e9sentateur :");
      if(c!==null&&norm(c)==="ephec"){PRES=true;setPres();render();}
      else if(c!==null)alert("Code incorrect.");
      return;
    }
  }
  $mb.addEventListener("click",function(ev){
    var m=ev.target.closest(".mitem"),d=ev.target.closest("[data-do]");
    if(d){doMenu(d.getAttribute("data-do"));return;}
    if(!m)return;
    var id=m.getAttribute("data-menu");
    if(openMenu===id){shutMenus();return;}
    shutMenus();
    document.getElementById("m-"+id).hidden=false;
    m.classList.add("open");openMenu=id;
  });
  document.addEventListener("click",function(ev){if(!ev.target.closest(".mbar"))shutMenus();});
  document.getElementById("fs").addEventListener("click",goFull);

  document.addEventListener("keydown",function(ev){
    if(ev.target.tagName==="INPUT")return;
    var k=ev.key.toLowerCase(),dlg=!!document.querySelector(".rev");
    if(ev.key==="Escape"){if(dlg){st.closed[st.i]=1;render();}else shutMenus();return;}
    if(ev.key==="Enter"&&dlg){st.closed[st.i]=1;render();return;}
    if(ev.key==="ArrowRight"){ev.preventDefault();$nx.click();return;}
    if(ev.key==="ArrowLeft"){ev.preventDefault();$pv.click();return;}
    if(ev.key===" "){ev.preventDefault();togT();return;}
    if(ev.key==="+"||ev.key==="="){ev.preventDefault();zoom(Z+.1);return;}
    if(ev.key==="-"||ev.key==="_"){ev.preventDefault();zoom(Z-.1);return;}
    if(k==="a"){vote(0);return;}
    if(k==="b"){vote(1);return;}
    if(k==="c"){vote(2);return;}
    if(k==="p"){buildPrint("played");setTimeout(function(){try{window.print();}catch(err){}},80);return;}
    if(k==="t"){buildPrint("full");setTimeout(function(){try{window.print();}catch(err){}},80);return;}
  });
  var rt=null;
  window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(applyFit,120);});

  buildG();paintG();render();
})();
</script>
