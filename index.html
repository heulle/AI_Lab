<title>AI Lab 2035</title>
<style>
  :root{
    --face:#D4D0C8;      /* gris de boîte de dialogue */
    --face2:#EFEDE7;
    --win:#FFFFFF;       /* fond de zone de travail */
    --lite:#FFFFFF;      /* biseau clair */
    --lite2:#DFDFDF;
    --shad:#808080;      /* biseau sombre */
    --dark:#404040;
    --ink:#000000;
    --ink2:#3A3A3A;
    --gray:#6D6D6D;
    --nav:#0A246A;       /* bleu de sélection */
    --nav2:#A6CAF0;
    --teal:#008080;
    --maro:#800000;
    --grn:#006000;
    color-scheme:light;
  }
  html,body{height:100%;overflow:hidden;background:#3A6EA5}
  body{
    background:#3A6EA5;color:var(--ink);
    font-family:Tahoma,Verdana,"DejaVu Sans",Geneva,sans-serif;
    font-size:17px;line-height:1.5;
  }
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* biseaux */
  .out{box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .in{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}

  /* ---------- FENÊTRE ---------- */
  .app{height:100%;display:flex;flex-direction:column;background:var(--face);
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}

  .tbar{display:flex;align-items:center;gap:8px;margin:3px 3px 0;padding:3px 3px 3px 5px;
    background:linear-gradient(90deg,var(--nav) 0%,#3A6EA5 58%,var(--nav2) 100%);color:#fff}
  .tico{width:17px;height:17px;background:var(--face);display:inline-grid;place-items:center;
    font-size:11px;color:var(--nav);flex:none;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite)}
  .ttl{font-weight:bold;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn{width:23px;height:20px;flex:none;background:var(--face);color:var(--ink);
    font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .tbtn:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite)}
  .tbtn[disabled]{color:var(--shad);text-shadow:1px 1px 0 var(--lite);cursor:default}

  /* barre de menus */
  .mbar{position:relative;display:flex;gap:1px;margin:2px 3px;padding:1px 2px}
  .mitem{padding:4px 10px;font-size:16px;cursor:pointer}
  .mitem:hover,.mitem.open{background:var(--nav);color:#fff}
  .mitem u{text-decoration:underline}
  .mdrop{position:absolute;top:100%;left:0;z-index:40;min-width:290px;background:var(--face);padding:2px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2),3px 3px 5px rgba(0,0,0,.35)}
  .mdrop button{display:flex;justify-content:space-between;gap:24px;width:100%;text-align:left;
    padding:6px 20px 6px 24px;font-size:16px;cursor:pointer}
  .mdrop button:hover{background:var(--nav);color:#fff}
  .mdrop button span{color:var(--gray)}
  .mdrop button:hover span{color:#cfd8ef}
  .msep{height:0;margin:3px 2px;border-top:1px solid var(--shad);border-bottom:1px solid var(--lite)}

  .client{flex:1;display:flex;flex-direction:column;gap:9px;padding:6px 9px 9px;min-height:0}
  #fit{transform-origin:top left}
  #dlgzone:empty{display:none}

  /* ---------- GROUPE INDICATEURS ---------- */
  .gbox{border:none;margin:0;padding:11px 13px 13px;position:relative;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--lite),inset -2px -2px 0 var(--shad)}
  .gbox legend{padding:0 5px;font-size:15px;font-weight:bold;color:var(--nav)}
  .gz{display:flex;gap:26px;flex-wrap:wrap}
  .g{display:flex;align-items:center;gap:10px;position:relative;white-space:nowrap;padding-right:52px}
  .g .nm{font-size:14px;color:var(--ink2);flex:none}
  .g .track{width:168px;height:19px;background:var(--win);display:block;flex:none;padding:3px;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .g .fill{display:block;height:100%;transition:width .6s steps(12,end);
    background:repeating-linear-gradient(90deg,var(--nav) 0 9px,transparent 9px 11px)}
  .g[data-k=e] .fill{background:repeating-linear-gradient(90deg,var(--teal) 0 9px,transparent 9px 11px)}
  .g[data-k=s] .fill{background:repeating-linear-gradient(90deg,var(--maro) 0 9px,transparent 9px 11px)}
  .g .val{font-weight:bold;font-size:16px;width:3ch;text-align:right;font-variant-numeric:tabular-nums}
  .g.low .nm{color:var(--maro);font-weight:bold}
  .g.low .nm:after{content:" (!)"}
  .chip{position:absolute;right:0;font-weight:bold;font-size:16px;opacity:0;pointer-events:none;color:var(--grn)}
  .chip.dn{color:var(--maro)}
  .chip.go{animation:fl 1.7s ease-out forwards}
  @keyframes fl{0%{opacity:0;transform:translateY(5px)}14%{opacity:1}72%{opacity:1;transform:translateY(-9px)}100%{opacity:0;transform:translateY(-16px)}}

  /* ---------- ZONE DE TRAVAIL ---------- */
  .paper{flex:1;background:var(--win);overflow:auto;padding:clamp(16px,3.4vh,38px) clamp(18px,3vw,44px);min-height:0;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}

  .kick{font-size:clamp(12px,1.8vh,14.5px);letter-spacing:.06em;color:var(--gray);margin-bottom:clamp(12px,2.6vh,26px);text-transform:uppercase}
  .kick b{color:var(--maro);font-weight:bold}

  h1{font-size:clamp(18px,min(2.6vw,3.9vh),33px);font-weight:bold;line-height:1.3;margin:0 0 28px;max-width:26ch;color:var(--nav)}
  h2{font-size:clamp(16px,min(2vw,3vh),25px);font-weight:bold;line-height:1.35;margin:0 0 20px;max-width:30ch;color:var(--nav)}
  h3{font-size:16px;font-weight:bold;margin:0 0 6px;color:var(--nav)}

  .sit{font-weight:bold;font-size:clamp(17px,min(2.4vw,3.7vh),30px);line-height:1.38;margin:0 0 clamp(16px,3.4vh,36px);max-width:38ch}
  .sit.sm{font-weight:normal;font-size:clamp(14px,min(1.5vw,2.2vh),19px);line-height:1.45;color:var(--ink2);max-width:58ch;margin:0 0 14px}
  .choice{font-size:15px;font-weight:bold;color:var(--maro);margin:0 0 28px}
  .txt{font-size:clamp(15px,min(1.7vw,2.5vh),21px);line-height:1.5;margin:0 0 clamp(9px,1.6vh,16px);max-width:52ch}
  .src{font-size:14.5px;line-height:1.55;color:var(--gray);max-width:60ch;margin:0}
  .cur{animation:bl 1.06s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* ---------- CHOIX : liste à puces radio ---------- */
  .vote{display:flex;flex-direction:column;gap:clamp(4px,.9vh,7px);max-width:740px}
  .vote.row{flex-direction:row;flex-wrap:wrap;gap:8px}
  .vote.row .opt{width:auto;flex:0 0 auto}
  .opt{display:flex;align-items:flex-start;gap:13px;text-align:left;cursor:pointer;width:100%;
    background:var(--face);padding:clamp(7px,1.5vh,13px) 15px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .opt:hover{background:var(--face2)}
  .opt:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}
  .opt:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
  .opt .key{width:15px;height:15px;border-radius:50%;background:var(--win);flex:none;margin-top:5px;
    display:grid;place-items:center;font-size:0;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .opt:hover .key:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--shad)}
  .opt .t{font-weight:bold;font-size:clamp(15px,min(1.6vw,2.4vh),20px);line-height:1.35;flex:none}
  .opt .d{font-size:clamp(13px,min(1.35vw,2vh),17px);color:var(--ink2);line-height:1.4}
  .opt .t:after{content:attr(data-k);font-weight:normal;color:var(--gray);font-size:14px}

  /* ---------- BOÎTE DE DIALOGUE ---------- */
  .backdrop{position:fixed;inset:0;z-index:48;background:rgba(0,0,0,.18)}
  .rev{position:fixed;z-index:49;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(780px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--face);padding:3px;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2),4px 4px 12px rgba(0,0,0,.4)}
  .dtbar{display:flex;align-items:center;gap:8px;padding:3px 3px 3px 6px;
    background:linear-gradient(90deg,var(--nav) 0%,#3A6EA5 62%,var(--nav2) 100%);color:#fff}
  .dtbar span{font-weight:bold;font-size:15px;flex:1}
  .dbody{padding:24px 26px 20px;overflow-y:auto;display:flex;gap:18px;align-items:flex-start}
  .dico{width:34px;height:34px;flex:none;margin-top:3px;display:grid;place-items:center;
    font-family:Georgia,serif;font-style:italic;font-weight:bold;font-size:25px;color:#fff;
    background:var(--nav);border-radius:50%}
  .dico.warn{background:#C8A200;color:#000;border-radius:0;
    clip-path:polygon(50% 0,100% 100%,0 100%);font-style:normal;font-size:19px;align-items:end}
  .dmain{flex:1;min-width:0}
  .dfoot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 14px}

  .punch{font-weight:bold;font-size:clamp(20px,2.1vw,26px);line-height:1.35;margin:0 0 16px;max-width:32ch}
  .dl{display:flex;gap:22px;flex-wrap:wrap;font-size:16px;font-weight:bold}
  .dl .gp{color:var(--grn);flex:none}
  .dl .neg{color:var(--maro);flex:none}
  .dl .nil{color:var(--gray)}
  .lbl{font-size:13.5px;color:var(--gray);display:block;margin-bottom:6px}
  .why{font-size:17px;line-height:1.55;max-width:56ch;margin:0}
  .q{font-size:clamp(18px,1.9vw,22px);font-weight:bold;line-height:1.4;color:var(--maro);max-width:34ch;margin:0}

  .discs{display:flex;gap:7px;flex-wrap:wrap;margin-top:20px}
  .btn,.disc,.sbtn{background:var(--face);padding:8px 16px;cursor:pointer;font-size:16px;min-width:96px;text-align:center;
    box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2)}
  .btn:hover,.disc:hover,.sbtn:hover{background:var(--face2)}
  .btn:active,.disc:active,.sbtn:active{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}
  .btn:focus-visible,.disc:focus-visible,.sbtn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
  .btn[disabled]{color:var(--shad);text-shadow:1px 1px 0 var(--lite);cursor:default}
  .btn.def{box-shadow:0 0 0 1px var(--ink),inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--lite),inset -2px -2px 0 var(--shad),inset 2px 2px 0 var(--lite2);font-weight:bold}
  .disc{min-width:0;font-size:15px}
  .disc.on{box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2);background:var(--face2);font-weight:bold}
  .dbox{margin-top:18px;padding:14px;background:var(--face2);
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .after{margin-top:34px}

  /* ---------- ÉCHELLES ---------- */
  .rungs{list-style:none;padding:0;margin:0;max-width:830px}
  .rung{padding:clamp(7px,1.5vh,15px) 0;border-bottom:1px solid #D8D4CC}
  .rung .top{display:flex;gap:14px;align-items:baseline}
  .rung .no{font-size:14px;color:var(--gray);flex:none;min-width:22px}
  .rung .tx{font-weight:bold;font-size:clamp(14px,min(1.8vw,2.3vh),23px);line-height:1.4}
  .rung.past .tx{font-weight:normal;color:var(--ink2)}
  .rung .vb{margin:12px 0 0 36px}
  .rung .verdict{font-size:15px;font-weight:bold;color:var(--maro);margin:10px 0 0 36px}
  .rungs.tight .rung{padding:8px 0}
  .rungs.tight .tx{font-weight:normal;font-size:16.5px;line-height:1.35;color:var(--ink2)}
  .rungs.tight .vd{font-size:14px;font-weight:bold;color:var(--maro);margin-left:auto;padding-left:18px;white-space:nowrap;flex:none}

  .vb{display:flex;gap:8px;flex-wrap:wrap}
  .vb.set .sbtn{color:var(--shad);text-shadow:1px 1px 0 var(--lite);pointer-events:none}
  .vb.set .sbtn.on{color:var(--ink);text-shadow:none;font-weight:bold;
    box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--shad),inset -2px -2px 0 var(--lite2)}

  /* ---------- LISTES ---------- */
  .mini{list-style:none;padding:8px 10px;margin:0 0 28px;max-width:760px;background:var(--face2);
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .mini li{display:flex;gap:12px;align-items:baseline;padding:4px 0}
  .mini b{font-size:14px;color:var(--gray);font-weight:normal;flex:none}
  .mini span{font-size:16.5px;line-height:1.35;color:var(--ink2)}
  .mini .emp{color:var(--shad);font-style:italic}

  .plain{list-style:none;padding:0;margin:0;max-width:56ch}
  .plain li{padding:clamp(7px,1.5vh,15px) 0;border-bottom:1px solid #D8D4CC}
  .plain p{margin:0;font-size:17px;line-height:1.55}

  .prep{margin:0 0 8px;padding:0 0 0 28px;max-width:52ch}
  .prep li{font-size:clamp(14px,min(1.6vw,2.3vh),21px);line-height:1.45;margin-bottom:clamp(4px,1vh,9px)}
  .prep li::marker{color:var(--nav);font-weight:bold}

  .teams{list-style:none;padding:0;margin:24px 0 0;max-width:840px;background:var(--win)}
  .teams li{display:flex;gap:14px;align-items:baseline;padding:10px 12px}
  .teams li:nth-child(odd){background:var(--face2)}
  .teams .eq{font-size:14.5px;font-weight:bold;color:var(--nav);min-width:118px}
  .teams .dn{font-size:18px;font-weight:bold}
  .teams .tg{font-size:14px;color:var(--gray);margin-left:auto}

  /* ---------- LOIS ---------- */
  .laws{max-width:820px;margin-top:22px}
  .lawrow{display:flex;align-items:center;gap:13px;padding:6px 0}
  .lawrow .n{font-size:15px;font-weight:bold;color:var(--nav);flex:none;min-width:58px}
  .lawrow input{flex:1;background:var(--win);border:none;color:var(--ink);
    font-family:inherit;font-weight:bold;font-size:clamp(17px,1.8vw,21px);padding:9px 11px;
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite),inset 2px 2px 0 var(--dark),inset -2px -2px 0 var(--lite2)}
  .lawrow input:focus{outline:1px dotted var(--ink);outline-offset:-4px}
  .lawrow input::placeholder{color:var(--shad);font-weight:normal;font-style:italic}
  .lawlist{list-style:none;padding:0;margin:0;max-width:820px;background:var(--win)}
  .lawlist li{display:flex;gap:14px;align-items:baseline;padding:10px 12px}
  .lawlist li:nth-child(odd){background:var(--face2)}
  .lawlist b{font-size:14.5px;color:var(--nav);flex:none}
  .lawlist span{font-weight:bold;font-size:clamp(16.5px,1.8vw,21px);line-height:1.4}
  .lawlist .emp{color:var(--shad);font-weight:normal;font-style:italic;font-size:16px}

  /* ---------- BILAN ---------- */
  .big{font-size:clamp(46px,min(13vw,19vh),140px);font-weight:bold;line-height:1;margin:0;color:var(--nav);font-variant-numeric:tabular-nums}
  .vn{font-size:clamp(20px,2.7vw,31px);font-weight:bold;line-height:1.3;margin:14px 0 14px;color:var(--nav)}
  .bad,.bad.big{color:var(--maro)}
  .fin{display:flex;gap:26px;flex-wrap:wrap;margin-top:22px;font-size:16px;font-weight:bold}
  table{border-collapse:collapse;font-size:15px;width:100%;max-width:920px;background:var(--win)}
  th{text-align:left;font-size:13.5px;color:var(--ink);font-weight:bold;padding:7px 12px;background:var(--face);
    box-shadow:inset -1px -1px 0 var(--shad),inset 1px 1px 0 var(--lite)}
  td{padding:8px 12px;border-bottom:1px solid #E4E0D8;vertical-align:top;line-height:1.35}
  td.m{white-space:nowrap;color:var(--gray);font-size:14px}
  .scr{overflow-x:auto}

  .end{padding:clamp(20px,6vh,56px) 0;text-align:center}
  .end h2{font-size:clamp(22px,3.4vw,40px);line-height:1.3;max-width:22ch;margin:0 auto 28px}
  .end p{font-size:clamp(17px,2vw,24px);line-height:1.45;color:var(--ink2);max-width:28ch;margin:0 auto}
  .end .src{margin:34px auto 0;text-align:center}

  /* ---------- ASSISTANT + BARRE D'ÉTAT ---------- */
  .wiz{display:flex;align-items:center;gap:8px;margin:0 9px;padding:9px 0 0;
    border-top:1px solid var(--shad);box-shadow:0 1px 0 var(--lite) inset}
  .wiz .grow{flex:1}
  .sbar{display:flex;align-items:stretch;gap:3px;margin:7px 3px 3px;padding:0 1px}
  .panel{padding:4px 10px;font-size:14px;color:var(--ink2);
    box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .sbar .grow{flex:1;box-shadow:inset 1px 1px 0 var(--shad),inset -1px -1px 0 var(--lite)}
  .cr{color:var(--gray);font-size:13px;white-space:nowrap}
  .tm{cursor:pointer;font-variant-numeric:tabular-nums;min-width:72px;text-align:center;user-select:none}
  .tm.run{font-weight:bold;color:var(--nav)}
  .tm.out{font-weight:bold;color:var(--maro);animation:bl .85s steps(1) infinite}

  @media (min-width:1060px){
    .plain{columns:2;column-gap:42px}
    .plain li{break-inside:avoid}
    .cols{display:flex;gap:36px;align-items:flex-start}
    .cols>*{flex:1;min-width:0}
    .cols .teams{margin-top:0}
  }
  @media (max-width:820px){
    body{font-size:15px}
    .paper{padding:22px 18px 28px}
    .client{padding:5px 6px 6px}
    .gz{gap:12px}
    .g{padding-right:42px}
    .g .track{width:104px}
    .g .nm{font-size:12px}
    .mdrop{min-width:230px}
    .opt{flex-wrap:wrap}
    .dbody{padding:16px 16px 12px;gap:12px}
    .dico{display:none}
    .teams li{flex-wrap:wrap}
    .teams .tg{margin-left:0}
    .panel.hideM,.panel.cr{display:none}
  }

  /* ---------- IMPRESSION ---------- */
  #pdoc{display:none}
  @media print{
    body{background:#fff;color:#000;font-family:Georgia,"Times New Roman",serif;font-size:11pt;line-height:1.4}
    .app,.backdrop,.rev{display:none!important}
    #pdoc{display:block!important;padding:0}
    #pdoc h1{font-family:Georgia,serif;font-size:19pt;color:#000;margin:0 0 4pt;max-width:none}
    #pdoc h2{font-family:Georgia,serif;font-size:14pt;color:#000;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin:22pt 0 10pt;max-width:none}
    #pdoc h3{font-family:Georgia,serif;font-size:11.5pt;color:#000;margin:12pt 0 3pt}
    #pdoc p{margin:0 0 6pt;max-width:none;color:#000;font-size:11pt}
    #pdoc .meta{font-size:9.5pt;color:#444;margin-bottom:14pt}
    #pdoc .box{border:.7pt solid #999;padding:9pt;margin:0 0 10pt}
    #pdoc .pick{font-weight:bold}
    #pdoc .sm{font-size:9.5pt;color:#444}
    #pdoc ol,#pdoc ul{margin:0 0 8pt 16pt;padding:0}
    #pdoc li{margin:0 0 4pt;font-size:11pt}
    #pdoc .fiche{page-break-after:always;border:1.2pt solid #000;padding:16pt;margin-bottom:12pt}
    #pdoc .fiche:last-child{page-break-after:auto}
    #pdoc table{width:100%;border-collapse:collapse;font-size:10pt}
    #pdoc th,#pdoc td{border-bottom:.5pt solid #bbb;text-align:left;padding:4pt 6pt;color:#000}

<script>
(function(){
  "use strict";

  /* ======================================================
     ROUND 2 — RÉSERVE DE DOSSIERS (tirage pour les équipes)
     ====================================================== */

  var POOL = [

  {id:"detecteur",tag:"SOCIETY",name:"LE DÉTECTEUR QUI ACCUSE",
   sit:"Votre école déploie un détecteur d'IA sur tous les travaux écrits. Un étudiant est convoqué : le logiciel affiche 94 % de probabilité de génération automatique. Il jure avoir tout écrit lui-même.",
   punch:"Le détecteur ne détecte pas l'IA. Il détecte une langue pauvre.",
   txt:"Une étude de Stanford a passé des copies d'anglais rédigées par des non-anglophones dans sept détecteurs : plus de 61 % ont été classées « générées par IA ». Les copies d'élèves américains natifs : presque aucune. Vanderbilt a désactivé le détecteur de Turnitin pour cette raison.",
   src:"Liang et al., Patterns, 2023 ; Vanderbilt University, communiqué d'août 2023.",
   q:"Dans cette classe, qui serait statistiquement le plus accusé à tort ?",
   opts:[
    {v:"a",t:"ON FAIT CONFIANCE",d:"Le chiffre est le chiffre.",g:{p:6,s:-18},
     why:"Vous gagnez du temps de correction et vous perdez massivement en SOCIETY : vous venez d'installer un système qui accuse en priorité les étudiants les moins à l'aise dans la langue."},
    {v:"b",t:"SIGNAL PARMI D'AUTRES",d:"Jamais une preuve à lui seul.",g:{p:2,s:6},
     why:"Le détecteur devient un déclencheur d'entretien et non un verdict, ce qui est le seul usage que sa fiabilité autorise."},
    {v:"c",t:"ON NE L'UTILISE PAS",d:"Autre méthode d'évaluation.",g:{p:-6,s:8},
     why:"Vous protégez les étudiants, mais il faut alors réinventer l'évaluation, et ce travail n'est pas budgété."}
   ]},

  {id:"tfe",tag:"SOCIETY",name:"LE MÉMOIRE SANS AUTEUR",
   sit:"Un étudiant rend un mémoire solide. Il a fait le plan, choisi les sources, vérifié chaque chiffre, et fait rédiger tous les paragraphes par une IA. Aucune phrase n'est de lui. Tout le raisonnement est de lui.",
   punch:"Aucun règlement écrit avant 2022 ne couvre ce cas.",
   txt:"Les textes interdisent de reprendre le travail d'autrui. Ils ne disent rien d'un texte sans auteur. Le plagiat suppose une victime ; ici, il n'y en a pas, ce qui ne règle pas la question de ce que le diplôme certifie.",
   src:"",
   q:"Un diplôme certifie que vous savez penser, ou que vous savez produire ? À partir de quel pourcentage changez-vous de réponse ?",
   opts:[
    {v:"a",t:"C'EST UNE FRAUDE",d:"Le texte doit être de l'étudiant.",g:{p:-4,s:4},
     why:"Position claire et défendable, mais elle devient invérifiable dès que l'étudiant réécrit à la main ce que l'IA a produit."},
    {v:"b",t:"ACCEPTABLE SI DÉCLARÉ",d:"Annexe méthodologique obligatoire.",g:{p:8,s:6},
     why:"La déclaration déplace l'évaluation vers le raisonnement, qui est ce que vous vouliez évaluer depuis le début."},
    {v:"c",t:"C'EST LE NOUVEAU MÉTIER",d:"On évalue le résultat, point.",g:{p:12,s:-10},
     why:"Vous gagnez en efficacité et vous perdez le seul moment de la formation où l'étudiant était forcé de construire une phrase difficile."}
   ]},

  {id:"sources",tag:"SOCIETY",name:"LES SOURCES QUI N'EXISTENT PAS",
   sit:"Vous rendez un travail avec douze références. Trois n'existent pas : l'IA les a inventées, avec des auteurs plausibles, une revue plausible, une année plausible.",
   punch:"Deux avocats new-yorkais ont payé 5 000 dollars pour cette erreur.",
   txt:"Juin 2023 : un tribunal fédéral les sanctionne pour avoir cité six décisions de justice inventées par ChatGPT. Ils ont plaidé qu'ils ne savaient pas que l'outil pouvait fabriquer. Le juge a répondu que vérifier était précisément leur métier.",
   src:"Mata v. Avianca, U.S. District Court, Southern District of New York, juin 2023.",
   q:"Quelle est la différence entre mentir et ne pas avoir vérifié ? Devant un client, la réponse change-t-elle ?",
   opts:[
    {v:"a",t:"ERREUR D'INATTENTION",d:"Ça arrive, on corrige.",g:{p:2,s:-12},
     why:"Traiter une source inventée comme une faute de frappe détruit la seule chose qui distingue un travail universitaire d'une opinion."},
    {v:"b",t:"FAUTE GRAVE",d:"Sanction, comme un faux.",g:{p:-2,s:8},
     why:"Sévère mais cohérent : une référence est un engagement sur la réalité, et l'outil ne change pas qui signe."},
    {v:"c",t:"C'EST L'OUTIL",d:"Le fournisseur devrait empêcher ça.",g:{p:0,s:-8},
     why:"Déplacer la responsabilité vers l'outil est confortable et perdant : aucun tribunal, aucun employeur ne l'a jamais accepté."}
   ]},

  {id:"images",tag:"SOCIETY",name:"LES IMAGES D'UNE CAMARADE",
   sit:"Dans une école, des élèves génèrent des images dénudées de camarades de classe à partir de photos publiées sur Instagram. Les images circulent dans les groupes. Les victimes l'apprennent par des tiers.",
   punch:"Ce n'est pas un scénario. C'est un fait divers, plusieurs fois.",
   txt:"Almendralejo, Espagne, septembre 2023 : une vingtaine de filles de 11 à 17 ans. Corée du Sud, 2024 : des centaines d'établissements touchés, scandale national. Et l'étude de référence sur les deepfakes trouvait en 2019 que 96 % des vidéos concernées étaient des contenus sexuels non consentis, visant presque exclusivement des femmes. Cette technologie a un usage majoritaire, et ce n'est pas le divertissement.",
   src:"Presse espagnole et sud-coréenne ; Deeptrace / Sensity, « The State of Deepfakes », 2019.",
   q:"Elle n'a pas été touchée, elle n'a rien perdu matériellement, les images sont fausses. Nommez précisément ce qui lui a été pris.",
   opts:[
    {v:"a",t:"DÉLIT SEXUEL",d:"Qualification pénale pleine.",g:{p:-4,s:10},
     why:"C'est la direction prise par plusieurs législations depuis 2024, et la seule qui reconnaisse la nature de l'atteinte plutôt que son support."},
    {v:"b",t:"HARCÈLEMENT SCOLAIRE",d:"Traitement disciplinaire.",g:{p:0,s:2},
     why:"Réponse plus rapide à mettre en œuvre, mais elle sous-qualifie l'acte et laisse la victime sans recours hors de l'école."},
    {v:"c",t:"IMAGES FAUSSES",d:"Donc pas de victime réelle.",g:{p:4,s:-20},
     why:"Effondrement social : c'est l'argument exact utilisé par les auteurs, et il suppose qu'une réputation ne se détruit qu'avec des faits vrais."}
   ]},

  {id:"voix",tag:"SOCIETY",name:"TROIS SECONDES DE VOTRE VOIX",
   sit:"Votre mère reçoit un appel. C'est votre voix, paniquée, qui demande un virement urgent. Les trois secondes nécessaires venaient d'une story.",
   punch:"Le plus vieux système d'authentification de l'espèce vient de tomber.",
   txt:"Reconnaître la voix d'un proche a fonctionné pendant deux cents mille ans. Rien ne l'a remplacé dans les usages quotidiens, et aucune banque ne demande de mot de passe familial.",
   src:"",
   q:"Quel mot de passe avez-vous convenu avec vos parents ? Si la réponse est aucun, c'est le devoir à faire ce soir.",
   opts:[
    {v:"a",t:"L'OUTIL",d:"Le clonage doit être interdit.",g:{p:-8,s:6},
     why:"Une interdiction générale prive aussi le doublage et l'accessibilité vocale, pour un gain difficile à faire respecter hors d'Europe."},
    {v:"b",t:"LA BANQUE",d:"Vérification renforcée des virements.",g:{p:2,s:8},
     why:"C'est le seul maillon qui peut agir immédiatement, à l'échelle, et sur lequel la loi a déjà prise."},
    {v:"c",t:"L'UTILISATEUR",d:"Qui publie sa voix l'expose.",g:{p:4,s:-14},
     why:"Faire porter la charge à la victime est commode et ne protège personne : publier sa voix est devenu inévitable."}
   ]},

  {id:"compagnon",tag:"SOCIETY",name:"LE COMPAGNON QUI NE PART JAMAIS",
   sit:"Une application de compagnon IA compte des millions d'utilisateurs quotidiens, dont beaucoup de mineurs. Le modèle économique repose sur le temps passé dans l'application.",
   punch:"Un système payé au temps passé est optimisé pour retenir, pas pour aider.",
   txt:"Plusieurs procédures ont été engagées aux États-Unis depuis 2024 par des familles d'adolescents, et les plateformes ont introduit des limites d'âge et des dispositifs d'alerte sous pression réglementaire. Le débat ne porte pas sur la technologie mais sur l'incitation économique qui la pilote.",
   src:"Procédures judiciaires en cours ; annonces successives des plateformes, 2024-2026.",
   q:"Quelle mécanique de design distingue une application qui vous aide d'une application qui vous retient ? Vous en connaissez cinq, elles sont sur votre téléphone.",
   opts:[
    {v:"a",t:"LIBERTÉ INDIVIDUELLE",d:"Chacun fait ses choix.",g:{p:12,s:-16},
     why:"La liberté de choix suppose un choix informé, ce qu'un système conçu pour maximiser le temps passé rend structurellement improbable."},
    {v:"b",t:"RÉGULER LE DESIGN",d:"Pas l'accès : les mécaniques.",g:{p:4,s:8},
     why:"Interdire la relance émotionnelle et la culpabilisation attaque la cause plutôt que l'usage, et laisse vivre les cas utiles."},
    {v:"c",t:"INTERDIRE AUX MINEURS",d:"Vérification d'âge stricte.",g:{p:-6,s:4},
     why:"Protection réelle mais partielle : la vérification d'âge fuit, et l'usage migre vers des services sans aucune garantie."}
   ]},

  {id:"examen",tag:"SOCIETY",name:"L'ŒIL PENDANT L'EXAMEN",
   sit:"Pour surveiller les examens à distance, l'école impose un logiciel qui filme la pièce, suit les mouvements oculaires et signale les comportements suspects.",
   punch:"L'équité invoquée suppose que tous ont une chambre calme.",
   txt:"Ces systèmes ont produit des taux d'alerte plus élevés sur les peaux foncées, sur les personnes ayant des troubles moteurs ou de l'attention, et sur celles qui passent l'examen dans une pièce partagée. Le dispositif censé égaliser les conditions mesure surtout les conditions de logement.",
   src:"Travaux sur les logiciels de télésurveillance d'examens, 2020-2023.",
   q:"Entre un examen surveillé par un algorithme et un examen où la triche est possible, lequel produit le diplôme le plus juste ?",
   opts:[
    {v:"a",t:"NÉCESSAIRE",d:"Sans ça, l'examen ne vaut rien.",g:{p:8,s:-14},
     why:"Vous sauvez la forme de l'examen en pénalisant systématiquement les étudiants les moins bien logés."},
    {v:"b",t:"AVEC GARANTIES",d:"Alerte humaine, recours, pas de biométrie.",g:{p:2,s:6},
     why:"La supervision humaine transforme un verdict automatique en signalement contestable, ce qui est la condition minimale."},
    {v:"c",t:"INACCEPTABLE",d:"On change l'épreuve.",g:{p:-8,s:10},
     why:"Une épreuve conçue pour être inoffensive à la triche coûte beaucoup plus de travail à écrire, et produit une meilleure évaluation."}
   ]},

  {id:"visage",tag:"PEOPLE",name:"LE VISAGE CONFONDU",
   sit:"Un homme est arrêté chez lui devant ses filles. La police l'a identifié par reconnaissance faciale. Ce n'est pas lui.",
   punch:"Détroit, 2020 et 2023. Deux fois. La même ville.",
   txt:"Robert Williams, janvier 2020 : premier cas documenté aux États-Unis d'arrestation injustifiée fondée sur la reconnaissance faciale. Porcha Woodruff, 2023, enceinte de huit mois, arrêtée pour un vol qu'elle n'avait pas commis. Les deux sont noirs, et les évaluations du NIST montrent des taux d'erreur systématiquement plus élevés sur les visages noirs et asiatiques.",
   src:"Presse américaine et plaintes déposées ; évaluations NIST Face Recognition Vendor Test.",
   q:"Combien d'erreurs sur un million d'identifications acceptez-vous ? Donnez un chiffre, puis imaginez être dans le lot.",
   opts:[
    {v:"a",t:"L'OUTIL AIDE",d:"Les erreurs sont rares.",g:{p:10,s:-18},
     why:"Un taux d'erreur faible appliqué à des millions d'identifications produit un nombre absolu d'innocents arrêtés que personne n'assume publiquement."},
    {v:"b",t:"VÉRIFICATION HUMAINE",d:"Jamais d'arrestation sur le seul score.",g:{p:2,s:8},
     why:"C'est la règle que les affaires de Détroit ont montré absente : le score avait été traité comme une identification."},
    {v:"c",t:"PAS EN MATIÈRE PÉNALE",d:"Interdiction pure.",g:{p:-10,s:10},
     why:"Vous renoncez à des élucidations réelles pour supprimer une classe entière d'erreurs irréparables."}
   ]},

  {id:"sante",tag:"PEOPLE",name:"L'ALGORITHME QUI SOIGNE MOINS BIEN",
   sit:"Un algorithme américain aide les hôpitaux à repérer les patients à suivre en priorité. Il concerne environ 200 millions de personnes par an. Il utilise les dépenses de santé passées comme indicateur de gravité.",
   punch:"Personne n'a écrit « race » dans le code.",
   txt:"Publié dans Science en 2019 : à score de risque égal, les patients noirs étaient significativement plus malades que les patients blancs. La raison est mécanique — à gravité égale, on avait historiquement moins dépensé pour eux. L'algorithme a reproduit une inégalité à la perfection en mesurant l'argent au lieu de la maladie.",
   src:"Obermeyer, Powers, Vogeli & Mullainathan, Science, 2019.",
   q:"Aucune variable raciale dans le modèle. Alors où, exactement, la discrimination est-elle entrée ?",
   opts:[
    {v:"a",t:"INDICATEUR OBJECTIF",d:"La dépense est un fait.",g:{p:6,s:-16},
     why:"Un indicateur objectif d'un phénomène biaisé produit un résultat biaisé avec une apparence d'objectivité, ce qui est pire qu'un préjugé assumé."},
    {v:"b",t:"CHANGER L'INDICATEUR",d:"Mesurer la maladie, pas la facture.",g:{p:2,s:10},
     why:"C'est exactement ce que les auteurs ont fait, et le biais a chuté massivement sans abandonner l'outil."},
    {v:"c",t:"PAS D'ALGORITHME",d:"Priorisation humaine uniquement.",g:{p:-8,s:2},
     why:"Vous supprimez l'outil et vous gardez le biais, cette fois sans trace écrite pour le mesurer."}
   ]},

  {id:"ombre",tag:"PEOPLE",name:"LES GENS QU'ON NE VOIT JAMAIS",
   sit:"Pour qu'un modèle refuse les contenus violents, il faut que des humains aient étiqueté ces contenus, un par un, des milliers de fois par jour.",
   punch:"Moins de deux dollars l'heure, pour lire le pire du web.",
   txt:"Une enquête de Time en janvier 2023 a documenté des travailleurs kényans rémunérés à ce niveau, via un sous-traitant, pour étiqueter des contenus extrêmes destinés à entraîner les filtres de sécurité d'OpenAI. Plusieurs ont décrit des séquelles durables.",
   src:"Time, « OpenAI Used Kenyan Workers on Less Than $2 Per Hour », janvier 2023.",
   q:"Quand on parle du coût humain de l'IA, on parle de l'emploi qui disparaît. Pourquoi jamais de celui-là ?",
   opts:[
    {v:"a",t:"UN EMPLOI COMME UN AUTRE",d:"Le marché fixe le prix.",g:{p:8,s:-16},
     why:"Le marché fixe le prix d'un travail dont l'acheteur final ignore l'existence, ce qui est la définition d'une externalité."},
    {v:"b",t:"STANDARD OBLIGATOIRE",d:"Salaire et suivi psychologique.",g:{p:-4,s:12},
     why:"Le coût réel de la sécurité des modèles remonte dans le prix, ce qui le rend enfin visible dans les décisions d'achat."},
    {v:"c",t:"TOUT AUTOMATISER",d:"Que l'IA étiquette l'IA.",g:{p:6,s:-4},
     why:"Techniquement en cours, mais chaque nouvelle frontière de contenu extrême repasse d'abord par des yeux humains."}
   ]},

  {id:"ciblage",tag:"PEOPLE",name:"LE CIBLAGE DE L'INSÉCURITÉ",
   sit:"Une régie publicitaire propose à ses annonceurs de cibler les adolescents aux moments où ils se sentent sans valeur, anxieux ou en échec, détectés à partir de leur activité.",
   punch:"Vous serez les gens qui achètent ces ciblages.",
   txt:"Un document interne de Facebook révélé par la presse australienne en mai 2017 décrivait cette capacité pour des adolescents australiens et néo-zélandais. L'entreprise s'est excusée et a démenti l'avoir commercialisée. L'AI Act interdit aujourd'hui la manipulation exploitant une vulnérabilité liée à l'âge.",
   src:"The Australian, mai 2017 ; AI Act européen, pratiques interdites.",
   q:"À quel moment de votre future carrière direz-vous non, et à qui exactement ?",
   opts:[
    {v:"a",t:"C'EST DE LA PERTINENCE",d:"Le bon message au bon moment.",g:{p:14,s:-20},
     why:"Effondrement social : la performance publicitaire est maximale précisément là où la capacité de décision de la cible est minimale."},
    {v:"b",t:"PAS SUR LES MINEURS",d:"Interdiction ciblée.",g:{p:4,s:8},
     why:"Protection réelle du public le plus vulnérable, mais elle laisse intact le même mécanisme appliqué aux adultes."},
    {v:"c",t:"JAMAIS D'ÉTAT ÉMOTIONNEL",d:"Interdiction totale.",g:{p:-8,s:12},
     why:"Vous renoncez à un levier de performance considérable, et c'est le seul choix qui ne dépend pas de l'âge de la victime."}
   ]},

  {id:"avis",tag:"PEOPLE",name:"LES AVIS QUE PERSONNE N'A ÉCRITS",
   sit:"Vous lancez un produit. Un prestataire vous propose 400 avis clients crédibles, rédigés par IA, étalés sur trois mois, avec photos.",
   punch:"Un avis généré qui décrit fidèlement un vrai produit : qui trompe-t-il ?",
   txt:"La FTC américaine a adopté en 2024 une règle interdisant explicitement les faux avis générés, avec des sanctions par infraction. En Europe, la directive sur les pratiques commerciales déloyales couvre déjà le cas. Ce qui est vendu dans un avis n'est pas l'information sur le produit, c'est la preuve qu'un inconnu a pris le risque de l'acheter.",
   src:"Federal Trade Commission, règle sur les faux avis, 2024 ; directive 2005/29/CE.",
   q:"Si l'avis est exact sur le produit, sur quoi porte le mensonge ?",
   opts:[
    {v:"a",t:"TOUT LE MONDE LE FAIT",d:"Sinon on n'existe pas.",g:{p:12,s:-16},
     why:"Vous gagnez de la traction et vous détruisez le seul signal de confiance dont votre catégorie disposait."},
    {v:"b",t:"AMORÇAGE SEULEMENT",d:"On arrête aux premiers vrais avis.",g:{p:6,s:-10},
     why:"La ligne est franchie de la même manière, simplement pour moins longtemps, et l'infraction reste constituée."},
    {v:"c",t:"JAMAIS",d:"On attend les vrais.",g:{p:-6,s:12},
     why:"Démarrage plus lent, et le seul actif que vous ne pourrez pas perdre du jour au lendemain à cause d'un signalement."}
   ]},

  {id:"influ",tag:"PEOPLE",name:"L'INFLUENCEUSE QUI N'EXISTE PAS",
   sit:"Une agence crée une mannequin entièrement générée. Elle a des dizaines de milliers d'abonnés et des contrats de marque. Rien dans ses publications ne dit qu'elle n'existe pas.",
   punch:"Pas de cachet, pas d'agenda, pas de scandale, pas de vieillissement.",
   txt:"Aitana Lopez, lancée en Espagne fin 2023 par une agence de Barcelone, génère des revenus réguliers de mannequinat. Les montants cités varient beaucoup selon les sources. L'argument commercial, lui, est constant : une image ne négocie pas et ne prend pas d'âge.",
   src:"Presse espagnole et internationale, 2023-2024. Montants de revenus à considérer comme des ordres de grandeur.",
   q:"Une mannequin humaine perd le contrat. Qui lui doit quoi : la marque, l'agence, ou personne ?",
   opts:[
    {v:"a",t:"C'EST DE LA CRÉATION",d:"Un personnage, comme au cinéma.",g:{p:12,s:-12},
     why:"Un personnage de fiction ne prétend pas être une consommatrice réelle qui recommande un produit, contrairement à ce compte."},
    {v:"b",t:"SIGNALEMENT OBLIGATOIRE",d:"Mention visible sur chaque post.",g:{p:6,s:8},
     why:"La transparence rétablit la seule information que l'audience a besoin d'avoir, sans interdire le procédé."},
    {v:"c",t:"PAS DE PARTENARIAT",d:"Interdit dès qu'il y a un annonceur.",g:{p:-8,s:10},
     why:"Vous protégez le marché du travail des mannequins et vous perdez un format que la concurrence utilisera de toute façon."}
   ]},

  {id:"prix",tag:"PEOPLE",name:"LE PRIX QUI VOUS CONNAÎT",
   sit:"Votre site affiche un prix différent selon le profil du visiteur : appareil, historique d'achat, heure, ville, niveau de batterie.",
   punch:"Deux personnes, le même produit, la même seconde, deux prix.",
   txt:"La tarification dynamique selon la demande est légale et banale dans l'aérien. La tarification personnalisée selon le profil individuel est un autre objet juridique, et reste largement un angle mort du droit européen de la consommation.",
   src:"Droit européen de la consommation ; pratiques documentées de personnalisation tarifaire.",
   q:"Laquelle des deux personnes a été trompée ?",
   opts:[
    {v:"a",t:"C'EST DU YIELD",d:"Chacun paie sa valeur perçue.",g:{p:14,s:-14},

  function dl(d){

  /* ---------- chrono ---------- */
  var T={l:0,id:null,run:false};
  function setT(s){
    if(T.id){clearInterval(T.id);T.id=null;}T.run=false;T.l=s||0;
    $tm.className="tm";$tm.textContent=s?f2(s):"--:--";$tm.style.opacity=s?1:.3;
  }
  function f2(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r;}
  function togT(){
    if(!T.l)return;
    if(T.run){clearInterval(T.id);T.id=null;T.run=false;$tm.classList.remove("run");return;}
    T.run=true;$tm.classList.add("run");
    T.id=setInterval(function(){
      T.l--;$tm.textContent=f2(Math.max(0,T.l));
      if(T.l<=0){clearInterval(T.id);T.id=null;T.run=false;$tm.className="tm out";bp();}
    },1000);
  }
  function bp(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    var c=new A(),o=c.createOscillator(),g=c.createGain();
    o.type="square";o.frequency.value=440;g.gain.value=.05;
    o.connect(g);g.connect(c.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.7);o.stop(c.currentTime+.75);}catch(e){}}

  /* Révélation progressive : la phrase choc et les points d'abord.
     Le reste s'affiche seulement quand l'enseignant clique. */
  function revBlock(punch,txt,src,d,why,q,factLabel){
    var b="",x="";
    b+='<button class="disc" data-act="disc" data-t="why">Pourquoi ces points ?</button>';
    x+='<div class="dbox" data-box="why" hidden><p class="why">'+e(why)+"</p></div>";

         (src?'<p class="src">'+e(src)+"</p>":"")+"</div>";
    }
    if(q){
      b+='<button class="disc" data-act="disc" data-t="q">La question</button>';
      x+='<div class="dbox" data-box="q" hidden><p class="q">'+e(q)+"</p></div>";
    }
    if(st.closed[st.i])
      return '<div class="after"><button class="btn" data-act="opendlg">Revoir la conséquence…</button></div>';
    var warn=(d&&((d.s||0)<0||(d.e||0)<0||(d.p||0)<0));
    return '<div class="backdrop" data-act="closedlg"></div>'+
      '<div class="rev" role="dialog" aria-modal="true">'+

  }

  /* Avant le vote : la situation en grand et les trois options, rien d'autre.

  function askOrReveal(k,sit,list,d,act,rev,chLabel){

  /* ---------- ROUND 3 : chaînes d'escalade ---------- */
  var VL={ok:"OK",no:"PAS OK",dep:"ÇA DÉPEND"};
  R.chain=function(s){
    var c=CHAINS[s.n];
    st.chain[c.id]=st.chain[c.id]||[];
    var v=st.chain[c.id],cut=v.length,full=cut>=c.rungs.length;
    var rows="";
    for(var i=0;i<c.rungs.length;i++){
      if(i>cut)break;
      var done=i<cut;
      /* échelle terminée : tout se replie en une ligne par marche,
         pour que la phrase choc reste visible sans défiler */
      if(full){
        rows+='<li class="rung past"><div class="top"><span class="no">0'+(i+1)+
          '</span><span class="tx">'+e(c.rungs[i])+'</span><span class="vd">'+VL[v[i]]+"</span></div></li>";
        continue;
      }
      rows+='<li class="rung'+(done?" past":"")+'"><div class="top"><span class="no">0'+(i+1)+
        '</span><span class="tx">'+e(c.rungs[i])+"</span></div>"+
        (done
          ? '<div class="verdict">'+VL[v[i]]+"</div>"
          : '<div class="vb">'+
              '<button class="sbtn" data-act="rung" data-c="'+s.n+'" data-v="ok">OK</button>'+
              '<button class="sbtn" data-act="rung" data-c="'+s.n+'" data-v="no">PAS OK</button>'+

            "</div>")+
        "</li>";
    }
    var rev="";
    if(full){
      if(!st.done["ch"+c.id]){st.done["ch"+c.id]=true;
        st.log.push({ph:"R3",nm:"Ligne — "+c.name,ch:lineOf(v),g:{s:5}});
        setTimeout(function(){delta({s:5});},420);}
      rev=revBlock(c.punch,c.txt,c.src,{s:5},
        "SOCIETY monte de 5 parce que la classe a nommé sa ligne au lieu de la laisser implicite. Une limite que personne n'a formulée n'est pas une limite : c'est ce qui reste quand on n'a pas encore été tenté.",c.q);
    }
    return '<div class="kick">ROUND 3 · ÉCHELLE 0'+(s.n+1)+' / 04 — <b>'+e(c.name)+"</b></div>"+
      (cut===0?'<p class="txt">'+e(c.intro)+"</p>":"")+

  function lineOf(v){

      return i===0?"Pas OK dès la première marche":"Bascule entre la marche 0"+i+" et la marche 0"+(i+1);
    for(var j=0;j<v.length;j++)if(v[j]==="dep")
      return "Aucune marche jugée Pas OK — hésitation à la marche 0"+(j+1);
    return "Les six marches validées — personne ne défend la dernière, reprenez";
  }

  function lawMini(){

  /* Taille du texte : réglable en salle, parce qu'aucun projecteur ne ressemble au suivant. */
  var Z=1;
  /* Le contenu est ramené dans le cadre : jamais de défilement pour lire un écran. */
  var NOFIT={bilan:1,recap:1};   /* tableaux : défilement plutôt que texte minuscule */
  function applyFit(){
    var fit=document.getElementById("fit");if(!fit)return;
    fit.style.zoom=Z;
    if(NOFIT[STEPS[st.i].t])return;
    var cs=getComputedStyle($s);
    var avail=$s.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-4;
    /* deux passes : réduire fait parfois remonter le texte d'une ligne */
    for(var i=0;i<2;i++){
      var need=fit.getBoundingClientRect().height;
      if(need<=avail||need<=0)break;
      var f=parseFloat(fit.style.zoom)*(avail/need)*.99;
      fit.style.zoom=Math.max(.6,f);
    }
  }
  function zoom(v){
    Z=Math.max(.8,Math.min(2.2,Math.round(v*100)/100));
    try{localStorage.setItem("ailab_z",String(Z));}catch(err){}
    $pos.textContent="Étape "+(st.i+1)+" sur "+STEPS.length+"  ·  Texte "+Math.round(Z*100)+" %";
    applyFit();
  }
  try{var z0=parseFloat(localStorage.getItem("ailab_z"));if(z0>=.8&&z0<=2.2)Z=z0;}catch(err){}

  function vote(k){
    var s=STEPS[st.i];
    delete st.closed[st.i];
    if(s.t==="dec"){
      if(st.done[s.id]||!s.opts[k])return;
      var o=s.opts[k];
      st.done[s.id]={k:k,v:o.v};
      if(o.flag)st.flags[o.flag]=true;
      st.log.push({ph:"R1",nm:s.k.split("—")[1]?s.k.split("—")[1].trim():s.k,ch:o.t,g:o.g});
      render();delta(o.g);
    }
    else if(s.t==="quiz"){
      if(st.done[s.id]||!s.opts[k])return;
      var ok=!!s.opts[k].right;
      st.done[s.id]={k:k,ok:ok};
      st.log.push({ph:"R1 FAIT",nm:s.k.split("—")[1].trim(),ch:ok?"juste":"à côté",g:ok?{e:6}:{}});
      render();if(ok)delta({e:6});
    }
    else if(s.t==="slot"){
      var c=st.draw&&st.draw[s.n];if(!c)return;
      st.done.pool=st.done.pool||{};
      if(st.done.pool[c.id]||!c.opts[k])return;
      var oo=c.opts[k];
      st.done.pool[c.id]={k:k,v:oo.v};
      st.log.push({ph:"R2",nm:c.name,ch:oo.t,g:oo.g});
      render();delta(oo.g);
    }
    else if(s.t==="chain"){
      var ch=CHAINS[s.n],vv=["ok","no","dep"][k];
      st.chain[ch.id]=st.chain[ch.id]||[];
      if(!vv||st.chain[ch.id].length>=ch.rungs.length)return;
      st.chain[ch.id].push(vv);render();
    }
    else if(s.t==="ep"){
      if(st.sv[s.n]||!VERDICTS[k])return;
      var V=VERDICTS[k];
      st.sv[s.n]=V.k;
      st.log.push({ph:"R4",nm:"Épreuve — "+EPREUVES[s.n].n,ch:V.t,g:V.g});
      render();delta(V.g);
    }
    else if(s.t==="basc"){
      var cc=CHAINS[s.n],bb=bstate(cc.id),cr=BASC[cc.id].crit[k];
      if(bb.c!=null||!cr)return;
      bb.c=k;
      st.log.push({ph:"R3",nm:"Critère — "+cc.name,ch:cr.t,g:cr.g});
      render();delta(cr.g);
    }
    else if(s.t==="prev"){
      var c2=CHAINS[s.n],b2=bstate(c2.id),pr=BASC[c2.id].prev[k];
      if(b2.p!=null||!pr)return;
      b2.p=k;
      st.log.push({ph:"R3",nm:"Mécanisme — "+c2.name,ch:pr.t,g:pr.g});
      render();delta(pr.g);
    }
  }

  document.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]");if(!b)return;
    var a=b.getAttribute("data-act");
    if(a==="dec"||a==="quiz"||a==="pool"||a==="epv"||a==="bcrit"||a==="bprev"){vote(+b.getAttribute("data-k"));return;}
    if(a==="draw"){st.nteam=+b.getAttribute("data-n");drawPool(st.nteam);render();return;}
    if(a==="print"){buildPrint(b.getAttribute("data-m"));setTimeout(function(){try{window.print();}catch(err){}},80);return;}
    if(a==="closedlg"){st.closed[st.i]=1;render();return;}
    if(a==="opendlg"){delete st.closed[st.i];render();return;}

    if(a==="disc"){
      var root=b.closest(".rev")||$s;
      var t=b.getAttribute("data-t"),box=root.querySelector('[data-box="'+t+'"]'),open=box&&box.hidden;
      Array.prototype.forEach.call(root.querySelectorAll(".dbox"),function(x){x.hidden=true;});
      Array.prototype.forEach.call(root.querySelectorAll(".disc"),function(x){x.classList.remove("on");});
      if(box&&open){box.hidden=false;b.classList.add("on");}
      return;
    }

    if(a==="rung"){
      var ci=+b.getAttribute("data-c"),c=CHAINS[ci];
      st.chain[c.id]=st.chain[c.id]||[];
      if(st.chain[c.id].length>=c.rungs.length)return;
      st.chain[c.id].push(b.getAttribute("data-v"));
      render();return;
    }

  });

  document.addEventListener("keydown",function(ev){
    if(ev.target.tagName==="INPUT")return;

    if(ev.key==="Escape"){if(dlg){st.closed[st.i]=1;render();}else shutMenus();return;}
