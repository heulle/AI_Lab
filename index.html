<title>AI Lab 2035</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root{
    --bg:#000000;
    --grn:#39FF6A;      /* phosphore vif */
    --grn2:#22C24C;     /* phosphore moyen */
    --grn3:#0F6B2C;     /* phosphore faible : bordures */
    --grn4:#073616;     /* presque éteint */
    --amb:#FFB000;      /* ambre : alertes et malus */
    --wht:#D9FFE4;      /* surbrillance */
    color-scheme:dark;
  }
  html,body{height:100%;background:var(--bg)}
  body{
    color:var(--wht);
    font-family:VT323,"IBM Plex Mono",ui-monospace,monospace;
    font-size:28px;line-height:1.45;
    background:var(--bg);
  }
  *{box-sizing:border-box}
  button{font:inherit;color:inherit;background:none}

  /* scanlines discrètes : lisibilité d'abord */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,rgba(0,0,0,0) 1px 4px);
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .app{min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}

  /* ---------- BANDEAU + JAUGES ASCII ---------- */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--grn3)}
  .hw{max-width:1000px;margin:0 auto;padding:9px 22px}
  .sys{
    font-family:"Press Start 2P",monospace;font-size:8.5px;letter-spacing:.06em;
    color:var(--grn2);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:9px;text-shadow:none;
  }
  .sys b{color:var(--grn);font-weight:400}
  .gz{display:flex;flex-direction:column;gap:1px}
  .g{display:flex;align-items:center;gap:12px;position:relative;white-space:nowrap;align-self:flex-start;padding-right:74px}
  .g .nm{font-family:"Press Start 2P",monospace;font-size:8.5px;width:86px;color:var(--grn2);text-shadow:none;flex:none}
  .g .bar{font-size:21px;letter-spacing:-.04em;color:var(--grn);overflow:hidden}
  .g .val{font-size:21px;width:3ch;text-align:right;color:var(--wht)}
  .g.low .bar,.g.low .val{color:var(--amb);text-shadow:0 0 8px rgba(255,176,0,.5)}
  .g.low .nm{color:var(--amb)}
  .g.low .nm:after{content:" !"}
  .chip{position:absolute;right:0;font-size:22px;opacity:0;pointer-events:none;color:var(--wht)}
  .chip.dn{color:var(--amb)}
  .chip.go{animation:fl 1.7s steps(9) forwards}
  @keyframes fl{0%{opacity:0}12%{opacity:1}75%{opacity:1}100%{opacity:0}}

  /* ---------- SCÈNE ---------- */
  main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:40px 22px 34px}

  .kick{
    font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.8;letter-spacing:.03em;
    color:var(--grn2);margin-bottom:30px;
  }
  .kick b{color:var(--amb);font-weight:400}

  h1,h2{font-family:"Press Start 2P",monospace;font-weight:400;color:var(--grn)}
  h1{font-size:clamp(18px,2.9vw,31px);line-height:1.5;margin:0 0 32px;max-width:24ch}
  h2{font-size:clamp(15px,2.1vw,21px);line-height:1.65;margin:0 0 22px;max-width:32ch}
  h3{font-family:"Press Start 2P",monospace;font-weight:400;font-size:11px;line-height:1.7;margin:0 0 9px;color:var(--grn)}

  .sit{font-size:clamp(27px,3.1vw,38px);line-height:1.36;margin:0 0 38px;max-width:40ch;color:var(--wht)}
  .sit.sm{font-size:clamp(21px,1.9vw,24px);line-height:1.4;color:var(--grn2);max-width:56ch;margin:0 0 18px}
  .choice{font-family:"Press Start 2P",monospace;font-size:11px;line-height:1.7;color:var(--amb);margin:0 0 32px}
  .txt{font-size:clamp(25px,2.4vw,30px);line-height:1.46;margin:0 0 18px;max-width:48ch;color:var(--wht)}
  .src{font-size:21px;line-height:1.45;color:var(--grn2);max-width:52ch;margin:0}
  .cur{animation:bl 1.06s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  /* ---------- CHOIX ---------- */
  .vote{display:flex;flex-direction:column;gap:8px;max-width:760px}
  .opt{
    display:flex;align-items:baseline;gap:14px;text-align:left;cursor:pointer;
    border:1px solid var(--grn3);padding:11px 15px;width:100%;
    transition:background .1s,border-color .1s;
  }
  .opt:hover{background:var(--grn4);border-color:var(--grn)}
  .opt:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
  .opt .key{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--amb);flex:none}
  .opt .t{font-size:29px;color:var(--wht);flex:none}
  .opt .d{font-size:23px;color:var(--grn2)}
  .vote.done .opt{opacity:.26;pointer-events:none}
  .vote.done .opt.pick{opacity:1;background:var(--grn4);border-color:var(--grn)}
  .vote.done .opt.right{opacity:.66;border-color:var(--amb)}
  .vote.done .opt.right .t:after{content:" <<";color:var(--amb)}

  /* ---------- RÉVÉLATION ---------- */
  .rev{margin-top:40px;border-top:1px solid var(--grn3);padding-top:30px}
  .punch{
    font-family:"Press Start 2P",monospace;font-size:clamp(15px,2.2vw,24px);line-height:1.65;
    margin:0 0 26px;max-width:28ch;color:var(--grn);
  }
  .dl{display:flex;gap:26px;flex-wrap:wrap;font-size:27px;color:var(--wht)}
  .dl .gp{color:var(--wht);font-size:27px;flex:none}
  .dl .neg{color:var(--amb);font-size:27px;flex:none}
  .dl .nil{color:var(--grn2)}
  .lbl{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--grn2);display:block;margin-bottom:10px}
  .why{font-size:25px;line-height:1.46;color:var(--wht);max-width:48ch;margin:0}
  .q{font-size:clamp(27px,2.9vw,34px);line-height:1.36;color:var(--amb);max-width:34ch;margin:0}

  /* révélation progressive : on clique pour afficher */
  .discs{display:flex;gap:9px;flex-wrap:wrap;margin-top:30px}
  .disc{
    border:1px solid var(--grn3);padding:9px 15px;cursor:pointer;
    font-family:"Press Start 2P",monospace;font-size:10px;line-height:1.6;color:var(--grn2);
  }
  .disc:hover{border-color:var(--grn);color:var(--grn);background:var(--grn4)}
  .disc:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
  .disc.on{border-color:var(--amb);color:var(--amb)}
  .dbox{margin-top:26px;border-left:2px solid var(--grn3);padding:4px 0 4px 20px}

  /* chaînes d'escalade */
  .rungs{list-style:none;padding:0;margin:0;max-width:820px}
  .rung{border-bottom:1px solid var(--grn4);padding:16px 0}
  .rung .top{display:flex;gap:16px;align-items:baseline}
  .rung .no{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--amb);flex:none}
  .rung .tx{font-size:clamp(25px,2.5vw,31px);line-height:1.34;color:var(--wht)}
  .rung.past .tx{color:var(--grn2)}
  .rung .vb{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0 45px}
  .rung .verdict{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--amb);margin:12px 0 0 45px}
  .rungs.tight .rung{padding:9px 0}
  .rungs.tight .tx{font-size:22px;line-height:1.3;color:var(--grn2)}
  .rungs.tight .vd{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--amb);margin-left:auto;padding-left:18px;white-space:nowrap;flex:none}
  .sbtn{border:1px solid var(--grn3);padding:8px 16px;cursor:pointer;font-size:24px;color:var(--wht)}
  .sbtn:hover{background:var(--grn4);border-color:var(--grn)}
  .sbtn:focus-visible{outline:2px solid var(--grn);outline-offset:1px}

  /* épreuves des lois */
  .mini{list-style:none;padding:0;margin:0 0 30px;max-width:760px}
  .mini li{display:flex;gap:14px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--grn4)}
  .mini b{font-family:"Press Start 2P",monospace;font-size:9px;color:var(--grn2);font-weight:400;flex:none}
  .mini span{font-size:23px;line-height:1.3;color:var(--grn2)}
  .mini .emp{color:var(--grn4)}

  /* ---------- LISTES / TABLEAUX ---------- */
  .plain{list-style:none;padding:0;margin:0;max-width:52ch}
  .plain li{padding:16px 0;border-bottom:1px solid var(--grn4)}
  .plain p{margin:0;font-size:24px;line-height:1.44;color:var(--wht)}

  .teams{list-style:none;padding:0;margin:26px 0 0;max-width:820px}
  .teams li{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--grn4)}
  .teams .eq{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--amb);min-width:128px}
  .teams .dn{font-size:26px;color:var(--wht)}
  .teams .tg{font-size:19px;color:var(--grn2);margin-left:auto}

  .laws{max-width:800px;margin-top:26px}
  .lawrow{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--grn3);padding:6px 0}
  .lawrow .n{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--amb);text-shadow:none}
  .lawrow input{
    flex:1;background:transparent;border:none;color:var(--wht);
    font-family:VT323,monospace;font-size:clamp(23px,2.6vw,29px);padding:7px 0;
    text-shadow:0 0 7px rgba(217,255,228,.35);
  }
  .lawrow input:focus{outline:none}
  .lawrow input::placeholder{color:var(--grn4)}
  .lawlist{list-style:none;padding:0;margin:0;max-width:800px}
  .lawlist li{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--grn4)}
  .lawlist b{font-family:"Press Start 2P",monospace;font-size:10px;color:var(--amb);font-weight:400;text-shadow:none}
  .lawlist span{font-size:clamp(22px,2.4vw,27px);line-height:1.3;color:var(--wht)}
  .lawlist .emp{color:var(--grn4)}

  .vb{display:flex;gap:9px;flex-wrap:wrap}
  .vb.set .sbtn{opacity:.24;pointer-events:none}
  .vb.set .sbtn.on{opacity:1;border-color:var(--amb);color:var(--amb);background:var(--grn4)}

  /* ---------- IMPRESSION ---------- */
  #pdoc{display:none}
  @media print{
    body{background:#fff;color:#000;font-family:Georgia,"Times New Roman",serif;font-size:11pt;line-height:1.4}
    body::after{display:none!important}
    .app{display:none!important}
    #pdoc{display:block!important;padding:0}
    #pdoc h1{font-family:Georgia,serif;font-size:19pt;color:#000;margin:0 0 4pt;max-width:none}
    #pdoc h2{font-family:Georgia,serif;font-size:14pt;color:#000;border-bottom:1.5pt solid #000;padding-bottom:3pt;margin:22pt 0 10pt;max-width:none}
    #pdoc h3{font-family:Georgia,serif;font-size:11.5pt;color:#000;margin:12pt 0 3pt}
    #pdoc p{margin:0 0 6pt;max-width:none;color:#000;font-size:11pt}
    #pdoc .meta{font-size:9.5pt;color:#444;margin-bottom:14pt}
    #pdoc .box{border:.7pt solid #999;padding:9pt;margin:0 0 10pt}
    #pdoc .pick{font-weight:bold}
    #pdoc .sm{font-size:9.5pt;color:#444}
    #pdoc ol,#pdoc ul{margin:0 0 8pt 16pt;padding:0}
    #pdoc li{margin:0 0 4pt;font-size:11pt}
    #pdoc .fiche{page-break-after:always;border:1.2pt solid #000;padding:16pt;margin-bottom:12pt}
    #pdoc .fiche:last-child{page-break-after:auto}
    #pdoc table{width:100%;border-collapse:collapse;font-size:10pt}
    #pdoc th,#pdoc td{border-bottom:.5pt solid #bbb;text-align:left;padding:4pt 6pt;color:#000}
    @page{margin:16mm}
  }

  /* ---------- BILAN ---------- */
  .big{font-family:"Press Start 2P",monospace;font-size:clamp(58px,14vw,150px);line-height:1;margin:0;color:var(--grn);text-shadow:0 0 26px rgba(57,255,106,.6)}
  .vn{font-family:"Press Start 2P",monospace;font-size:clamp(15px,2.8vw,28px);line-height:1.5;margin:22px 0 18px}
  .bad,.bad.big{color:var(--amb);text-shadow:0 0 26px rgba(255,176,0,.5)}
  .fin{display:flex;gap:26px;flex-wrap:wrap;margin-top:26px;font-size:22px;color:var(--wht)}
  table{border-collapse:collapse;font-size:20px;width:100%;max-width:860px}
  th{text-align:left;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--grn2);font-weight:400;padding:0 14px 8px 0;border-bottom:1px solid var(--grn3);text-shadow:none}
  td{padding:9px 14px 9px 0;border-bottom:1px solid var(--grn4);vertical-align:top;line-height:1.3}
  td.m{white-space:nowrap;color:var(--grn2)}
  .scr{overflow-x:auto}

  .end{padding:64px 0}
  .end h2{font-size:clamp(17px,3.6vw,40px);line-height:1.55;max-width:20ch;margin-bottom:34px}
  .end p{font-size:clamp(22px,2.9vw,32px);line-height:1.35;color:var(--grn2);max-width:26ch;margin:0}

  /* ---------- PIED ---------- */
  footer{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--grn3);padding-bottom:env(safe-area-inset-bottom,0px)}
  .fw{max-width:1000px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:9px}
  .nb{border:1px solid var(--grn3);padding:6px 13px;cursor:pointer;font-size:20px;color:var(--wht)}
  .nb:hover{background:var(--grn4);border-color:var(--grn)}
  .nb:focus-visible{outline:2px solid var(--grn);outline-offset:1px}
  .nb[disabled]{opacity:.22;pointer-events:none}
  .nb.go{border-color:var(--grn);color:var(--grn)}
  .pos{flex:1;font-size:18px;color:var(--grn3);text-shadow:none}
  .tm{font-size:21px;color:var(--grn2);cursor:pointer;padding:6px 11px;border:1px solid transparent;user-select:none}
  .tm:hover{border-color:var(--grn3)}
  .tm.run{color:var(--grn);border-color:var(--grn3)}
  .tm.out{color:var(--amb);animation:bl .85s steps(1) infinite}

  @media (max-width:760px){
    body{font-size:21px}
    .hw{padding:8px 16px}
    main{padding:26px 16px}
    .g .nm{width:66px;font-size:7px}
    .g .bar{font-size:16px}
    .sys{font-size:7px;gap:10px}
    .opt{flex-wrap:wrap;gap:8px}
    .teams li{flex-wrap:wrap}
    .teams .tg{margin-left:0}
    .pos{display:none}
  }
</style>

<div class="app">
  <header><div class="hw">
    <div class="sys">
      <span>AI-LAB-2035</span><span>MODE <b>CLASSE</b></span>
      <span>SESSION <b id="sess">01</b></span><span id="stat">SYS <b>READY</b></span>
    </div>
    <div class="gz" id="gz"></div>
  </div></header>

  <main id="stage"></main>

  <footer><div class="fw">
    <button class="nb" id="prev">&lt;&lt;</button>
    <div class="pos" id="pos"></div>
    <div class="tm" id="tm" role="button" tabindex="0">--:--</div>
    <button class="nb" id="rst" title="Nouvelle partie">RESET</button>
    <button class="nb go" id="next">SUIVANT &gt;&gt;</button>
  </div></footer>
</div>

<div id="pdoc"></div>

<script>
(function(){
  "use strict";

  /* ======================================================
     ROUND 2 — RÉSERVE DE DOSSIERS (tirage pour les équipes)
     ====================================================== */

  var POOL = [

  {id:"detecteur",tag:"SOCIETY",name:"LE DÉTECTEUR QUI ACCUSE",
   sit:"Votre école déploie un détecteur d'IA sur tous les travaux écrits. Un étudiant est convoqué : le logiciel affiche 94 % de probabilité de génération automatique. Il jure avoir tout écrit lui-même.",
   punch:"Le détecteur ne détecte pas l'IA. Il détecte une langue pauvre.",
   txt:"Une étude de Stanford a passé des copies d'anglais rédigées par des non-anglophones dans sept détecteurs : plus de 61 % ont été classées « générées par IA ». Les copies d'élèves américains natifs : presque aucune. Vanderbilt a désactivé le détecteur de Turnitin pour cette raison.",
   src:"Liang et al., Patterns, 2023 ; Vanderbilt University, communiqué d'août 2023.",
   q:"Dans cette classe, qui serait statistiquement le plus accusé à tort ?",
   opts:[
    {v:"a",t:"ON FAIT CONFIANCE",d:"Le chiffre est le chiffre.",g:{p:6,s:-18},
     why:"Vous gagnez du temps de correction et vous perdez massivement en SOCIETY : vous venez d'installer un système qui accuse en priorité les étudiants les moins à l'aise dans la langue."},
    {v:"b",t:"SIGNAL PARMI D'AUTRES",d:"Jamais une preuve à lui seul.",g:{p:2,s:6},
     why:"Le détecteur devient un déclencheur d'entretien et non un verdict, ce qui est le seul usage que sa fiabilité autorise."},
    {v:"c",t:"ON NE L'UTILISE PAS",d:"Autre méthode d'évaluation.",g:{p:-6,s:8},
     why:"Vous protégez les étudiants, mais il faut alors réinventer l'évaluation, et ce travail n'est pas budgété."}
   ]},

  {id:"tfe",tag:"SOCIETY",name:"LE MÉMOIRE SANS AUTEUR",
   sit:"Un étudiant rend un mémoire solide. Il a fait le plan, choisi les sources, vérifié chaque chiffre, et fait rédiger tous les paragraphes par une IA. Aucune phrase n'est de lui. Tout le raisonnement est de lui.",
   punch:"Aucun règlement écrit avant 2022 ne couvre ce cas.",
   txt:"Les textes interdisent de reprendre le travail d'autrui. Ils ne disent rien d'un texte sans auteur. Le plagiat suppose une victime ; ici, il n'y en a pas, ce qui ne règle pas la question de ce que le diplôme certifie.",
   src:"",
   q:"Un diplôme certifie que vous savez penser, ou que vous savez produire ? À partir de quel pourcentage changez-vous de réponse ?",
   opts:[
    {v:"a",t:"C'EST UNE FRAUDE",d:"Le texte doit être de l'étudiant.",g:{p:-4,s:4},
     why:"Position claire et défendable, mais elle devient invérifiable dès que l'étudiant réécrit à la main ce que l'IA a produit."},
    {v:"b",t:"ACCEPTABLE SI DÉCLARÉ",d:"Annexe méthodologique obligatoire.",g:{p:8,s:6},
     why:"La déclaration déplace l'évaluation vers le raisonnement, qui est ce que vous vouliez évaluer depuis le début."},
    {v:"c",t:"C'EST LE NOUVEAU MÉTIER",d:"On évalue le résultat, point.",g:{p:12,s:-10},
     why:"Vous gagnez en efficacité et vous perdez le seul moment de la formation où l'étudiant était forcé de construire une phrase difficile."}
   ]},

  {id:"sources",tag:"SOCIETY",name:"LES SOURCES QUI N'EXISTENT PAS",
   sit:"Vous rendez un travail avec douze références. Trois n'existent pas : l'IA les a inventées, avec des auteurs plausibles, une revue plausible, une année plausible.",
   punch:"Deux avocats new-yorkais ont payé 5 000 dollars pour cette erreur.",
   txt:"Juin 2023 : un tribunal fédéral les sanctionne pour avoir cité six décisions de justice inventées par ChatGPT. Ils ont plaidé qu'ils ne savaient pas que l'outil pouvait fabriquer. Le juge a répondu que vérifier était précisément leur métier.",
   src:"Mata v. Avianca, U.S. District Court, Southern District of New York, juin 2023.",
   q:"Quelle est la différence entre mentir et ne pas avoir vérifié ? Devant un client, la réponse change-t-elle ?",
   opts:[
    {v:"a",t:"ERREUR D'INATTENTION",d:"Ça arrive, on corrige.",g:{p:2,s:-12},
     why:"Traiter une source inventée comme une faute de frappe détruit la seule chose qui distingue un travail universitaire d'une opinion."},
    {v:"b",t:"FAUTE GRAVE",d:"Sanction, comme un faux.",g:{p:-2,s:8},
     why:"Sévère mais cohérent : une référence est un engagement sur la réalité, et l'outil ne change pas qui signe."},
    {v:"c",t:"C'EST L'OUTIL",d:"Le fournisseur devrait empêcher ça.",g:{p:0,s:-8},
     why:"Déplacer la responsabilité vers l'outil est confortable et perdant : aucun tribunal, aucun employeur ne l'a jamais accepté."}
   ]},

  {id:"images",tag:"SOCIETY",name:"LES IMAGES D'UNE CAMARADE",
   sit:"Dans une école, des élèves génèrent des images dénudées de camarades de classe à partir de photos publiées sur Instagram. Les images circulent dans les groupes. Les victimes l'apprennent par des tiers.",
   punch:"Ce n'est pas un scénario. C'est un fait divers, plusieurs fois.",
   txt:"Almendralejo, Espagne, septembre 2023 : une vingtaine de filles de 11 à 17 ans. Corée du Sud, 2024 : des centaines d'établissements touchés, scandale national. Et l'étude de référence sur les deepfakes trouvait en 2019 que 96 % des vidéos concernées étaient des contenus sexuels non consentis, visant presque exclusivement des femmes. Cette technologie a un usage majoritaire, et ce n'est pas le divertissement.",
   src:"Presse espagnole et sud-coréenne ; Deeptrace / Sensity, « The State of Deepfakes », 2019.",
   q:"Elle n'a pas été touchée, elle n'a rien perdu matériellement, les images sont fausses. Nommez précisément ce qui lui a été pris.",
   opts:[
    {v:"a",t:"DÉLIT SEXUEL",d:"Qualification pénale pleine.",g:{p:-4,s:10},
     why:"C'est la direction prise par plusieurs législations depuis 2024, et la seule qui reconnaisse la nature de l'atteinte plutôt que son support."},
    {v:"b",t:"HARCÈLEMENT SCOLAIRE",d:"Traitement disciplinaire.",g:{p:0,s:2},
     why:"Réponse plus rapide à mettre en œuvre, mais elle sous-qualifie l'acte et laisse la victime sans recours hors de l'école."},
    {v:"c",t:"IMAGES FAUSSES",d:"Donc pas de victime réelle.",g:{p:4,s:-20},
     why:"Effondrement social : c'est l'argument exact utilisé par les auteurs, et il suppose qu'une réputation ne se détruit qu'avec des faits vrais."}
   ]},

  {id:"voix",tag:"SOCIETY",name:"TROIS SECONDES DE VOTRE VOIX",
   sit:"Votre mère reçoit un appel. C'est votre voix, paniquée, qui demande un virement urgent. Les trois secondes nécessaires venaient d'une story.",
   punch:"Le plus vieux système d'authentification de l'espèce vient de tomber.",
   txt:"Reconnaître la voix d'un proche a fonctionné pendant deux cents mille ans. Rien ne l'a remplacé dans les usages quotidiens, et aucune banque ne demande de mot de passe familial.",
   src:"",
   q:"Quel mot de passe avez-vous convenu avec vos parents ? Si la réponse est aucun, c'est le devoir à faire ce soir.",
   opts:[
    {v:"a",t:"L'OUTIL",d:"Le clonage doit être interdit.",g:{p:-8,s:6},
     why:"Une interdiction générale prive aussi le doublage et l'accessibilité vocale, pour un gain difficile à faire respecter hors d'Europe."},
    {v:"b",t:"LA BANQUE",d:"Vérification renforcée des virements.",g:{p:2,s:8},
     why:"C'est le seul maillon qui peut agir immédiatement, à l'échelle, et sur lequel la loi a déjà prise."},
    {v:"c",t:"L'UTILISATEUR",d:"Qui publie sa voix l'expose.",g:{p:4,s:-14},
     why:"Faire porter la charge à la victime est commode et ne protège personne : publier sa voix est devenu inévitable."}
   ]},

  {id:"compagnon",tag:"SOCIETY",name:"LE COMPAGNON QUI NE PART JAMAIS",
   sit:"Une application de compagnon IA compte des millions d'utilisateurs quotidiens, dont beaucoup de mineurs. Le modèle économique repose sur le temps passé dans l'application.",
   punch:"Un système payé au temps passé est optimisé pour retenir, pas pour aider.",
   txt:"Plusieurs procédures ont été engagées aux États-Unis depuis 2024 par des familles d'adolescents, et les plateformes ont introduit des limites d'âge et des dispositifs d'alerte sous pression réglementaire. Le débat ne porte pas sur la technologie mais sur l'incitation économique qui la pilote.",
   src:"Procédures judiciaires en cours ; annonces successives des plateformes, 2024-2026.",
   q:"Quelle mécanique de design distingue une application qui vous aide d'une application qui vous retient ? Vous en connaissez cinq, elles sont sur votre téléphone.",
   opts:[
    {v:"a",t:"LIBERTÉ INDIVIDUELLE",d:"Chacun fait ses choix.",g:{p:12,s:-16},
     why:"La liberté de choix suppose un choix informé, ce qu'un système conçu pour maximiser le temps passé rend structurellement improbable."},
    {v:"b",t:"RÉGULER LE DESIGN",d:"Pas l'accès : les mécaniques.",g:{p:4,s:8},
     why:"Interdire la relance émotionnelle et la culpabilisation attaque la cause plutôt que l'usage, et laisse vivre les cas utiles."},
    {v:"c",t:"INTERDIRE AUX MINEURS",d:"Vérification d'âge stricte.",g:{p:-6,s:4},
     why:"Protection réelle mais partielle : la vérification d'âge fuit, et l'usage migre vers des services sans aucune garantie."}
   ]},

  {id:"examen",tag:"SOCIETY",name:"L'ŒIL PENDANT L'EXAMEN",
   sit:"Pour surveiller les examens à distance, l'école impose un logiciel qui filme la pièce, suit les mouvements oculaires et signale les comportements suspects.",
   punch:"L'équité invoquée suppose que tous ont une chambre calme.",
   txt:"Ces systèmes ont produit des taux d'alerte plus élevés sur les peaux foncées, sur les personnes ayant des troubles moteurs ou de l'attention, et sur celles qui passent l'examen dans une pièce partagée. Le dispositif censé égaliser les conditions mesure surtout les conditions de logement.",
   src:"Travaux sur les logiciels de télésurveillance d'examens, 2020-2023.",
   q:"Entre un examen surveillé par un algorithme et un examen où la triche est possible, lequel produit le diplôme le plus juste ?",
   opts:[
    {v:"a",t:"NÉCESSAIRE",d:"Sans ça, l'examen ne vaut rien.",g:{p:8,s:-14},
     why:"Vous sauvez la forme de l'examen en pénalisant systématiquement les étudiants les moins bien logés."},
    {v:"b",t:"AVEC GARANTIES",d:"Alerte humaine, recours, pas de biométrie.",g:{p:2,s:6},
     why:"La supervision humaine transforme un verdict automatique en signalement contestable, ce qui est la condition minimale."},
    {v:"c",t:"INACCEPTABLE",d:"On change l'épreuve.",g:{p:-8,s:10},
     why:"Une épreuve conçue pour être inoffensive à la triche coûte beaucoup plus de travail à écrire, et produit une meilleure évaluation."}
   ]},

  {id:"visage",tag:"PEOPLE",name:"LE VISAGE CONFONDU",
   sit:"Un homme est arrêté chez lui devant ses filles. La police l'a identifié par reconnaissance faciale. Ce n'est pas lui.",
   punch:"Détroit, 2020 et 2023. Deux fois. La même ville.",
   txt:"Robert Williams, janvier 2020 : premier cas documenté aux États-Unis d'arrestation injustifiée fondée sur la reconnaissance faciale. Porcha Woodruff, 2023, enceinte de huit mois, arrêtée pour un vol qu'elle n'avait pas commis. Les deux sont noirs, et les évaluations du NIST montrent des taux d'erreur systématiquement plus élevés sur les visages noirs et asiatiques.",
   src:"Presse américaine et plaintes déposées ; évaluations NIST Face Recognition Vendor Test.",
   q:"Combien d'erreurs sur un million d'identifications acceptez-vous ? Donnez un chiffre, puis imaginez être dans le lot.",
   opts:[
    {v:"a",t:"L'OUTIL AIDE",d:"Les erreurs sont rares.",g:{p:10,s:-18},
     why:"Un taux d'erreur faible appliqué à des millions d'identifications produit un nombre absolu d'innocents arrêtés que personne n'assume publiquement."},
    {v:"b",t:"VÉRIFICATION HUMAINE",d:"Jamais d'arrestation sur le seul score.",g:{p:2,s:8},
     why:"C'est la règle que les affaires de Détroit ont montré absente : le score avait été traité comme une identification."},
    {v:"c",t:"PAS EN MATIÈRE PÉNALE",d:"Interdiction pure.",g:{p:-10,s:10},
     why:"Vous renoncez à des élucidations réelles pour supprimer une classe entière d'erreurs irréparables."}
   ]},

  {id:"sante",tag:"PEOPLE",name:"L'ALGORITHME QUI SOIGNE MOINS BIEN",
   sit:"Un algorithme américain aide les hôpitaux à repérer les patients à suivre en priorité. Il concerne environ 200 millions de personnes par an. Il utilise les dépenses de santé passées comme indicateur de gravité.",
   punch:"Personne n'a écrit « race » dans le code.",
   txt:"Publié dans Science en 2019 : à score de risque égal, les patients noirs étaient significativement plus malades que les patients blancs. La raison est mécanique — à gravité égale, on avait historiquement moins dépensé pour eux. L'algorithme a reproduit une inégalité à la perfection en mesurant l'argent au lieu de la maladie.",
   src:"Obermeyer, Powers, Vogeli & Mullainathan, Science, 2019.",
   q:"Aucune variable raciale dans le modèle. Alors où, exactement, la discrimination est-elle entrée ?",
   opts:[
    {v:"a",t:"INDICATEUR OBJECTIF",d:"La dépense est un fait.",g:{p:6,s:-16},
     why:"Un indicateur objectif d'un phénomène biaisé produit un résultat biaisé avec une apparence d'objectivité, ce qui est pire qu'un préjugé assumé."},
    {v:"b",t:"CHANGER L'INDICATEUR",d:"Mesurer la maladie, pas la facture.",g:{p:2,s:10},
     why:"C'est exactement ce que les auteurs ont fait, et le biais a chuté massivement sans abandonner l'outil."},
    {v:"c",t:"PAS D'ALGORITHME",d:"Priorisation humaine uniquement.",g:{p:-8,s:2},
     why:"Vous supprimez l'outil et vous gardez le biais, cette fois sans trace écrite pour le mesurer."}
   ]},

  {id:"ombre",tag:"PEOPLE",name:"LES GENS QU'ON NE VOIT JAMAIS",
   sit:"Pour qu'un modèle refuse les contenus violents, il faut que des humains aient étiqueté ces contenus, un par un, des milliers de fois par jour.",
   punch:"Moins de deux dollars l'heure, pour lire le pire du web.",
   txt:"Une enquête de Time en janvier 2023 a documenté des travailleurs kényans rémunérés à ce niveau, via un sous-traitant, pour étiqueter des contenus extrêmes destinés à entraîner les filtres de sécurité d'OpenAI. Plusieurs ont décrit des séquelles durables.",
   src:"Time, « OpenAI Used Kenyan Workers on Less Than $2 Per Hour », janvier 2023.",
   q:"Quand on parle du coût humain de l'IA, on parle de l'emploi qui disparaît. Pourquoi jamais de celui-là ?",
   opts:[
    {v:"a",t:"UN EMPLOI COMME UN AUTRE",d:"Le marché fixe le prix.",g:{p:8,s:-16},
     why:"Le marché fixe le prix d'un travail dont l'acheteur final ignore l'existence, ce qui est la définition d'une externalité."},
    {v:"b",t:"STANDARD OBLIGATOIRE",d:"Salaire et suivi psychologique.",g:{p:-4,s:12},
     why:"Le coût réel de la sécurité des modèles remonte dans le prix, ce qui le rend enfin visible dans les décisions d'achat."},
    {v:"c",t:"TOUT AUTOMATISER",d:"Que l'IA étiquette l'IA.",g:{p:6,s:-4},
     why:"Techniquement en cours, mais chaque nouvelle frontière de contenu extrême repasse d'abord par des yeux humains."}
   ]},

  {id:"ciblage",tag:"PEOPLE",name:"LE CIBLAGE DE L'INSÉCURITÉ",
   sit:"Une régie publicitaire propose à ses annonceurs de cibler les adolescents aux moments où ils se sentent sans valeur, anxieux ou en échec, détectés à partir de leur activité.",
   punch:"Vous serez les gens qui achètent ces ciblages.",
   txt:"Un document interne de Facebook révélé par la presse australienne en mai 2017 décrivait cette capacité pour des adolescents australiens et néo-zélandais. L'entreprise s'est excusée et a démenti l'avoir commercialisée. L'AI Act interdit aujourd'hui la manipulation exploitant une vulnérabilité liée à l'âge.",
   src:"The Australian, mai 2017 ; AI Act européen, pratiques interdites.",
   q:"À quel moment de votre future carrière direz-vous non, et à qui exactement ?",
   opts:[
    {v:"a",t:"C'EST DE LA PERTINENCE",d:"Le bon message au bon moment.",g:{p:14,s:-20},
     why:"Effondrement social : la performance publicitaire est maximale précisément là où la capacité de décision de la cible est minimale."},
    {v:"b",t:"PAS SUR LES MINEURS",d:"Interdiction ciblée.",g:{p:4,s:8},
     why:"Protection réelle du public le plus vulnérable, mais elle laisse intact le même mécanisme appliqué aux adultes."},
    {v:"c",t:"JAMAIS D'ÉTAT ÉMOTIONNEL",d:"Interdiction totale.",g:{p:-8,s:12},
     why:"Vous renoncez à un levier de performance considérable, et c'est le seul choix qui ne dépend pas de l'âge de la victime."}
   ]},

  {id:"avis",tag:"PEOPLE",name:"LES AVIS QUE PERSONNE N'A ÉCRITS",
   sit:"Vous lancez un produit. Un prestataire vous propose 400 avis clients crédibles, rédigés par IA, étalés sur trois mois, avec photos.",
   punch:"Un avis généré qui décrit fidèlement un vrai produit : qui trompe-t-il ?",
   txt:"La FTC américaine a adopté en 2024 une règle interdisant explicitement les faux avis générés, avec des sanctions par infraction. En Europe, la directive sur les pratiques commerciales déloyales couvre déjà le cas. Ce qui est vendu dans un avis n'est pas l'information sur le produit, c'est la preuve qu'un inconnu a pris le risque de l'acheter.",
   src:"Federal Trade Commission, règle sur les faux avis, 2024 ; directive 2005/29/CE.",
   q:"Si l'avis est exact sur le produit, sur quoi porte le mensonge ?",
   opts:[
    {v:"a",t:"TOUT LE MONDE LE FAIT",d:"Sinon on n'existe pas.",g:{p:12,s:-16},
     why:"Vous gagnez de la traction et vous détruisez le seul signal de confiance dont votre catégorie disposait."},
    {v:"b",t:"AMORÇAGE SEULEMENT",d:"On arrête aux premiers vrais avis.",g:{p:6,s:-10},
     why:"La ligne est franchie de la même manière, simplement pour moins longtemps, et l'infraction reste constituée."},
    {v:"c",t:"JAMAIS",d:"On attend les vrais.",g:{p:-6,s:12},
     why:"Démarrage plus lent, et le seul actif que vous ne pourrez pas perdre du jour au lendemain à cause d'un signalement."}
   ]},

  {id:"influ",tag:"PEOPLE",name:"L'INFLUENCEUSE QUI N'EXISTE PAS",
   sit:"Une agence crée une mannequin entièrement générée. Elle a des dizaines de milliers d'abonnés et des contrats de marque. Rien dans ses publications ne dit qu'elle n'existe pas.",
   punch:"Pas de cachet, pas d'agenda, pas de scandale, pas de vieillissement.",
   txt:"Aitana Lopez, lancée en Espagne fin 2023 par une agence de Barcelone, génère des revenus réguliers de mannequinat. Les montants cités varient beaucoup selon les sources. L'argument commercial, lui, est constant : une image ne négocie pas et ne prend pas d'âge.",
   src:"Presse espagnole et internationale, 2023-2024. Montants de revenus à considérer comme des ordres de grandeur.",
   q:"Une mannequin humaine perd le contrat. Qui lui doit quoi : la marque, l'agence, ou personne ?",
   opts:[
    {v:"a",t:"C'EST DE LA CRÉATION",d:"Un personnage, comme au cinéma.",g:{p:12,s:-12},
     why:"Un personnage de fiction ne prétend pas être une consommatrice réelle qui recommande un produit, contrairement à ce compte."},
    {v:"b",t:"SIGNALEMENT OBLIGATOIRE",d:"Mention visible sur chaque post.",g:{p:6,s:8},
     why:"La transparence rétablit la seule information que l'audience a besoin d'avoir, sans interdire le procédé."},
    {v:"c",t:"PAS DE PARTENARIAT",d:"Interdit dès qu'il y a un annonceur.",g:{p:-8,s:10},
     why:"Vous protégez le marché du travail des mannequins et vous perdez un format que la concurrence utilisera de toute façon."}
   ]},

  {id:"prix",tag:"PEOPLE",name:"LE PRIX QUI VOUS CONNAÎT",
   sit:"Votre site affiche un prix différent selon le profil du visiteur : appareil, historique d'achat, heure, ville, niveau de batterie.",
   punch:"Deux personnes, le même produit, la même seconde, deux prix.",
   txt:"La tarification dynamique selon la demande est légale et banale dans l'aérien. La tarification personnalisée selon le profil individuel est un autre objet juridique, et reste largement un angle mort du droit européen de la consommation.",
   src:"Droit européen de la consommation ; pratiques documentées de personnalisation tarifaire.",
   q:"Laquelle des deux personnes a été trompée ?",
   opts:[
    {v:"a",t:"C'EST DU YIELD",d:"Chacun paie sa valeur perçue.",g:{p:14,s:-14},
     why:"Vous maximisez le revenu par visiteur et vous faites payer le plus cher à ceux qui ont le moins de moyens de comparer."},
    {v:"b",t:"PLAFONNER ET ANNONCER",d:"Écart borné et affiché.",g:{p:6,s:6},
     why:"Un écart connu reste négociable ; un écart caché ne se découvre que par accident, et toujours par le client lésé."},
    {v:"c",t:"INTERDIRE",d:"Un prix affiché, pour tous.",g:{p:-10,s:10},
     why:"Vous renoncez à une marge réelle pour conserver la seule chose qu'un prix affiché garantit : la comparabilité."}
   ]},

  {id:"chatbot",tag:"PEOPLE",name:"LE CHATBOT QUI ENGAGE",
   sit:"Votre chatbot promet à un client un remboursement qui n'existe pas dans vos conditions générales.",
   punch:"Air Canada a plaidé que son chatbot était une entité distincte.",
   txt:"Février 2024 : un tribunal canadien condamne la compagnie à honorer un tarif inventé par son propre agent conversationnel. Le tribunal a répondu que c'était sa page, son outil et son client.",
   src:"Moffatt v. Air Canada, British Columbia Civil Resolution Tribunal, février 2024.",
   q:"Si votre IA parle en votre nom, sur quoi porte encore votre contrôle qualité ?",
   opts:[
    {v:"a",t:"PAS ENGAGÉE",d:"C'est une erreur machine.",g:{p:4,s:-14},
     why:"Position déjà perdue devant un tribunal, et qui transfère au client le risque d'un outil que vous avez choisi de déployer."},
    {v:"b",t:"CAS PAR CAS",d:"Geste commercial selon le montant.",g:{p:6,s:-2},
     why:"Vous limitez la perte immédiate, et vous gardez une exposition juridique non provisionnée."},
    {v:"c",t:"ENGAGÉE",d:"Ce que dit le bot nous engage.",g:{p:-4,s:12},
     why:"Le coût remonte là où la décision de déployer a été prise, ce qui est la seule incitation efficace à borner l'outil."}
   ]},

  {id:"style",tag:"PEOPLE",name:"LE STYLE D'UN ARTISTE",
   sit:"Une marque veut une campagne dans le style d'une illustratrice reconnue, sans l'engager, en entraînant un modèle sur son portfolio public.",
   punch:"Le style n'est protégé par presque aucun droit.",
   txt:"Plusieurs procédures majeures sont en cours en Europe et aux États-Unis sur l'entraînement à partir d'œuvres protégées. L'AI Act impose une transparence sur le respect du droit d'auteur, mais ne tranche pas la question du style, que la plupart des systèmes juridiques laissent libre.",
   src:"Contentieux en cours ; AI Act, obligations relatives aux modèles à usage général.",
   q:"Vous imiterez des références toute votre carrière. Où finit l'inspiration et où commence le prélèvement ?",
   opts:[
    {v:"a",t:"UN STYLE EST LIBRE",d:"L'imitation a toujours existé.",g:{p:12,s:-12},
     why:"Vrai juridiquement, et l'imitation manuelle coûtait du temps, ce qui limitait mécaniquement l'échelle du prélèvement."},
    {v:"b",t:"LICENCE ET CACHET",d:"On la paie, même sans la briefer.",g:{p:2,s:10},
     why:"Vous internalisez un coût que la loi ne vous impose pas encore, et vous sécurisez la campagne contre un retournement d'opinion."},
    {v:"c",t:"ACCORD ÉCRIT OBLIGATOIRE",d:"Sinon on ne le fait pas.",g:{p:-8,s:8},
     why:"Position la plus protectrice pour les créateurs, la plus lente à produire, et difficile à imposer à vos concurrents."}
   ]},

  {id:"cobalt",tag:"PLANET",name:"CE QU'IL Y A DANS LA CARTE",
   sit:"Chaque GPU contient des métaux extraits dans des conditions que personne, dans votre chaîne d'approvisionnement, ne peut certifier.",
   punch:"La chaîne commence dans une mine, pas dans un data center.",
   txt:"Amnesty International documentait dès 2016 la présence d'enfants dans l'extraction artisanale du cobalt en République démocratique du Congo, et les difficultés de traçabilité dans les chaînes des grands fabricants d'électronique. La demande a augmenté depuis.",
   src:"Amnesty International, « This is what we die for », 2016, et rapports de suivi.",
   q:"Une IA qui optimise le tri des déchets a-t-elle un bilan positif si son matériel naît dans une mine artisanale ?",
   opts:[
    {v:"a",t:"PAS NOTRE MAILLON",d:"On achète du matériel, c'est tout.",g:{p:8,e:-12},
     why:"L'externalité est réelle même si elle est lointaine, et le bilan environnemental de l'amont est engagé avant votre première requête."},
    {v:"b",t:"AUDIT DE LA CHAÎNE",d:"Traçabilité exigée du fournisseur.",g:{p:-2,e:10},
     why:"Le coût matériel augmente et la part la plus lourde de l'empreinte devient enfin mesurable et négociable."},
    {v:"c",t:"REFUS SANS TRAÇABILITÉ",d:"Pas de preuve, pas d'achat.",g:{p:-10,e:12},
     why:"Position la plus exigeante, difficile à tenir sur un marché où la traçabilité complète n'existe quasiment pas."}
   ]},

  {id:"eau",tag:"PLANET",name:"L'EAU AILLEURS",
   sit:"Un projet de data center est contesté localement pendant une sécheresse historique, dans un pays où l'eau est déjà rationnée pour les habitants.",
   punch:"Montevideo 2023, le Chili, la Sambre 2026 : le même conflit sous trois climats.",
   txt:"En Uruguay, en pleine crise de l'eau à Montevideo, et sur plusieurs projets chiliens, des mobilisations locales ont obtenu la révision des permis. Le refus wallon sur la Sambre relève de la même logique : l'eau n'est pas un intrant illimité, et le point de bascule est local.",
   src:"Presse uruguayenne et chilienne, 2019-2023 ; décision wallonne d'août 2026.",
   q:"L'eau du Hainaut et l'eau de Montevideo appellent-elles la même réponse ? Justifiez sans dire « ça dépend ».",
   opts:[
    {v:"a",t:"LES EMPLOIS VALENT ÇA",d:"Le territoire y gagne.",g:{p:12,e:-14},
     why:"Les emplois sont réels et se comptent par centaines ; l'eau se compte en habitants, et les deux ne se compensent pas dans la même unité."},
    {v:"b",t:"CONDITIONS STRICTES",d:"Quotas, mesure publique, coupure en alerte.",g:{p:4,e:8},
     why:"Vous gardez le projet et vous rendez le prélèvement révisable, ce qui est la seule façon de tenir un engagement sur vingt ans."},
    {v:"c",t:"PAS EN ZONE SENSIBLE",d:"Interdiction d'implantation.",g:{p:-10,e:12},
     why:"Vous déplacez l'installation, donc l'impact, vers un territoire qui aura peut-être moins de moyens de la refuser."}
   ]},

  {id:"estim",tag:"PLANET",name:"L'ESTIMATION FAUSSE",
   sit:"Un exploitant annonce à une commune une consommation d'eau comprise entre 12 et 20 millions de litres par an. Le chiffre réel sera très supérieur.",
   punch:"Le conseil communal a appris le vrai chiffre par les journaux.",
   txt:"Aux Pays-Bas, un data center de Microsoft dans la commune de Hollands Kroon a consommé environ 84 millions de litres, révélés par la presse locale en 2022, contre une fourchette annoncée bien plus basse.",
   src:"Presse néerlandaise, 2022 ; chiffres confirmés ensuite par l'exploitant.",
   q:"Qui, dans votre commune, aurait le pouvoir de vérifier un tel chiffre, et en a réellement les moyens ?",
   opts:[
    {v:"a",t:"UNE ESTIMATION RESTE UNE ESTIMATION",d:"Personne ne savait.",g:{p:4,e:-12},
     why:"Une fourchette non contraignante transfère tout le risque sur la collectivité qui a accordé le permis."},
    {v:"b",t:"SANCTION EN CAS D'ÉCART",d:"L'estimation devient un engagement.",g:{p:-2,e:10},
     why:"Rendre l'annonce opposable est ce qui transforme une promesse en donnée, et ça ne coûte rien à l'exploitant honnête."},
    {v:"c",t:"MESURE PUBLIQUE CONTINUE",d:"Compteur ouvert en temps réel.",g:{p:-6,e:12},
     why:"La transparence permanente désarme le débat par les slogans, des deux côtés, et c'est exactement pour ça qu'elle est rare."}
   ]},

  {id:"gpu",tag:"PLANET",name:"OBSOLÈTE EN TROIS ANS",
   sit:"Le cycle de renouvellement du matériel d'IA est de l'ordre de trois à cinq ans. Une part importante de l'empreinte d'un GPU est engagée à la fabrication.",
   punch:"Un modèle plus efficace qui exige du matériel neuf est-il plus écologique ?",
   txt:"Une étude publiée dans Nature Computational Science en 2024 estime que l'IA générative pourrait ajouter entre 1,2 et 5 millions de tonnes de déchets électroniques d'ici 2030. L'empreinte de fabrication est payée avant la première requête, et le gain d'efficacité est réclamé après.",
   src:"Wang et al., Nature Computational Science, 2024.",
   q:"Quel argument écologique tient encore si on inclut la fabrication dans le calcul ?",
   opts:[

    st.chain[c.id]=st.chain[c.id]||[];
    var v=st.chain[c.id],cut=v.length,full=cut>=c.rungs.length;
    var rows="";
    for(var i=0;i<c.rungs.length;i++){
      if(i>cut)break;
      var done=i<cut;
      /* échelle terminée : tout se replie en une ligne par marche,
         pour que la phrase choc reste visible sans défiler */
      if(full){
        rows+='<li class="rung past"><div class="top"><span class="no">0'+(i+1)+
          '</span><span class="tx">'+e(c.rungs[i])+'</span><span class="vd">'+VL[v[i]]+"</span></div></li>";
        continue;
      }
      rows+='<li class="rung'+(done?" past":"")+'"><div class="top"><span class="no">0'+(i+1)+
        '</span><span class="tx">'+e(c.rungs[i])+"</span></div>"+
        (done
          ? '<div class="verdict">&gt; '+VL[v[i]]+"</div>"
          : '<div class="vb">'+
              '<button class="sbtn" data-act="rung" data-c="'+s.n+'" data-v="ok">OK</button>'+
              '<button class="sbtn" data-act="rung" data-c="'+s.n+'" data-v="no">PAS OK</button>'+
              '<button class="sbtn" data-act="rung" data-c="'+s.n+'" data-v="dep">ÇA DÉPEND</button>'+
            "</div>")+
        "</li>";
    }
    var rev="";
    if(full){
      if(!st.done["ch"+c.id]){st.done["ch"+c.id]=true;
        st.log.push({ph:"R3",nm:"Ligne — "+c.name,ch:lineOf(v),g:{s:5}});
        setTimeout(function(){delta({s:5});},420);}
      rev=revBlock(c.punch,c.txt,c.src,{s:5},
        "SOCIETY monte de 5 parce que la classe a nommé sa ligne au lieu de la laisser implicite. Une limite que personne n'a formulée n'est pas une limite : c'est ce qui reste quand on n'a pas encore été tenté.",c.q);
    }

  /* ---------- RÉCAPITULATIF IMPRIMABLE ---------- */
  function pLaws(){
    var h="<ol>";

  function pDeltas(d){

  function fiche(c,i){
    return '<div class="fiche"><p class="sm">AI LAB 2035 — ROUND 2 — DOSSIER '+(i+1)+" / "+e(c.tag)+"</p>"+

  function buildPrint(mode){

    h+="<h2>The Class AI Act</h2>"+pLaws();

    h+="<h2>Round 1 — décisions</h2>";

      h+='<div class="box"><h3>'+e(s.k.replace(/^ROUND 1 · /,""))+"</h3><p>"+e(s.sit)+"</p>"+

      h+='<div class="box"><h3>'+e(s.k.replace(/^ROUND 1 · /,""))+"</h3><p>"+e(s.sit)+"</p>"+

    h+="<h2>Round 2 — dossiers en équipes</h2>";

        h+='<div class="box"><h3>Équipe '+(i+1)+" — "+e(c.name)+" ("+e(c.tag)+")</h3><p>"+e(c.sit)+"</p>"+
          "<p><i>Options :</i> "+c.opts.map(function(x){return e(x.t);}).join(" / ")+"</p>"+
          (o?'<p class="pick">Choix de la classe : '+e(o.t)+" — "+pDeltas(o.g)+"</p>"+
              "<p><i>Pourquoi ces points :</i> "+e(o.why)+"</p>":"<p><i>Non joué.</i></p>")+
          "<p><b>"+e(c.punch)+"</b></p><p>"+e(c.txt)+"</p>"+
          (c.src?'<p class="sm">'+e(c.src)+"</p>":"")+
          "<p><i>Question ouverte :</i> "+e(c.q)+"</p></div>";
      });
    } else h+="<p><i>Aucun dossier tiré.</i></p>";

    h+="<h2>Round 3 — où est la ligne ?</h2>";
    CHAINS.forEach(function(c){
      var v=st.chain[c.id]||[];
      h+='<div class="box"><h3>'+e(c.name)+" — "+e(v.length?lineOf(v):"non jouée")+"</h3><ol>"+
        c.rungs.map(function(r,i){
          return "<li>"+e(r)+(v[i]?" <b>["+VL[v[i]]+"]</b>":"")+"</li>";}).join("")+"</ol>"+
        "<p><b>"+e(c.punch)+"</b></p><p>"+e(c.txt)+"</p>"+
        (c.src?'<p class="sm">'+e(c.src)+"</p>":"")+
        "<p><i>Question ouverte :</i> "+e(c.q)+"</p></div>";
    });

    h+="<h2>Round 4 — les huit épreuves</h2>";
    EPREUVES.forEach(function(ep,i){
      var v=st.sv[i];
      h+='<div class="box"><h3>'+e(ep.n)+"</h3><p>"+e(ep.sit)+"</p>"+
        '<p class="pick">Verdict : '+(v?(v==="ok"?"couverte par nos lois":"trou dans la loi"):"non jouée")+"</p>"+
        "<p><i>Relance :</i> "+e(ep.q)+"</p></div>";
    });

    h+="<h2>Ce que l'AI Act européen prévoit déjà</h2>";
    AIACT.forEach(function(a){h+="<h3>"+e(a[0])+"</h3><p>"+e(a[1])+"</p>";});

    h+="<h2>Journal des décisions</h2><table><tr><th>Phase</th><th>Cas</th><th>Choix</th><th>Impact</th></tr>";
    st.log.forEach(function(l){h+="<tr><td>"+e(l.ph)+"</td><td>"+e(l.nm)+"</td><td>"+e(l.ch)+"</td><td>"+pDeltas(l.g)+"</td></tr>";});
    h+="</table>";

    h+="<h2>Sources</h2><p class=\"sm\">University of Washington, AIES 2024 · Stanford Digital Economy Lab 2026 · AIE, Energy and AI 2025 · Central Statistics Office Ireland 2026 · rapport environnemental de Google via la presse belge 2023 · refus de pompage dans la Sambre, presse belge août 2026 · Obermeyer et al., Science 2019 · Time janvier 2023 · Liang et al., Patterns 2023 · Mata v. Avianca 2023 · Moffatt v. Air Canada 2024 · Deeptrace 2019 · Amnesty International 2016 · Nature Computational Science 2024 · International AI Safety Report 2026 · AI Act européen.</p>";

    document.getElementById("pdoc").innerHTML=h;

  var TIMERS={dec:60,quiz:60,slot:150,draw:600,chain:240,laws:300,ep:120};
  function render(){
    var s=STEPS[st.i];
    setT(TIMERS[s.t]||0);
    $pv.disabled=st.i===0;
    $nx.textContent=st.i===STEPS.length-1?"FIN":"SUIVANT >>";

  /* ======================================================
     ÉVÉNEMENTS
     ====================================================== */

  function vote(k){
    var s=STEPS[st.i];
    if(s.t==="dec"){
      if(st.done[s.id]||!s.opts[k])return;
      var o=s.opts[k];
      st.done[s.id]={k:k,v:o.v};
      if(o.flag)st.flags[o.flag]=true;
      st.log.push({ph:"R1",nm:s.k.split("—")[1]?s.k.split("—")[1].trim():s.k,ch:o.t,g:o.g});
      render();delta(o.g);
    }
    else if(s.t==="quiz"){
      if(st.done[s.id]||!s.opts[k])return;
      var ok=!!s.opts[k].right;
      st.done[s.id]={k:k,ok:ok};
      st.log.push({ph:"R1 FAIT",nm:s.k.split("—")[1].trim(),ch:ok?"juste":"à côté",g:ok?{e:6}:{}});
      render();if(ok)delta({e:6});
    }
    else if(s.t==="slot"){
      var c=st.draw&&st.draw[s.n];if(!c)return;
      st.done.pool=st.done.pool||{};
      if(st.done.pool[c.id]||!c.opts[k])return;
      var oo=c.opts[k];
      st.done.pool[c.id]={k:k,v:oo.v};
      st.log.push({ph:"R2",nm:c.name,ch:oo.t,g:oo.g});
      render();delta(oo.g);
    }
    else if(s.t==="chain"){
      var ch=CHAINS[s.n],vv=["ok","no","dep"][k];
      st.chain[ch.id]=st.chain[ch.id]||[];
      if(!vv||st.chain[ch.id].length>=ch.rungs.length)return;
      st.chain[ch.id].push(vv);render();
    }
    else if(s.t==="ep"){
      if(k>1||st.sv[s.n])return;
      var vd=k===0?"ok":"hole",dd=k===0?{s:4}:{s:-3,p:2};
      st.sv[s.n]=vd;
      st.log.push({ph:"R4",nm:"Épreuve — "+EPREUVES[s.n].n,ch:k===0?"couverte":"trou",g:dd});
      render();delta(dd);
    }
  }

  $s.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-act]");if(!b)return;
    var a=b.getAttribute("data-act");
    if(a==="dec"||a==="quiz"||a==="pool"){vote(+b.getAttribute("data-k"));return;}
    if(a==="draw"){st.nteam=+b.getAttribute("data-n");drawPool(st.nteam);render();return;}
    if(a==="print"){buildPrint(b.getAttribute("data-m"));setTimeout(function(){try{window.print();}catch(err){}},80);return;}

    if(a==="disc"){
      var t=b.getAttribute("data-t"),box=$s.querySelector('[data-box="'+t+'"]');
      if(box){box.hidden=!box.hidden;b.classList.toggle("on",!box.hidden);}
      return;
    }

    if(a==="rung"){
      var ci=+b.getAttribute("data-c"),c=CHAINS[ci];
      st.chain[c.id]=st.chain[c.id]||[];
      if(st.chain[c.id].length>=c.rungs.length)return;
      st.chain[c.id].push(b.getAttribute("data-v"));
      render();return;
    }

    if(a==="sv"){
      var i=+b.getAttribute("data-i"),v=b.getAttribute("data-v");
      if(st.sv[i])return;
      st.sv[i]=v;
      var d=v==="ok"?{s:4}:{s:-3,p:2};
      st.log.push({ph:"R4",nm:"Épreuve — "+EPREUVES[i].n,ch:v==="ok"?"couverte":"trou",g:d});
      render();delta(d);
    }
  });

  $s.addEventListener("input",function(ev){
    if(ev.target.getAttribute("data-act")==="law")st.laws[+ev.target.getAttribute("data-i")]=ev.target.value;
  });

  $nx.addEventListener("click",function(){if(st.i<STEPS.length-1){st.i++;render();}});
  $pv.addEventListener("click",function(){if(st.i>0){st.i--;render();}});
  $tm.addEventListener("click",togT);
  $tm.addEventListener("keydown",function(ev){if(ev.key==="Enter")togT();});
  $rs.addEventListener("click",function(){
    if(!confirm("Nouvelle partie ? Décisions, lois et tirage seront effacés."))return;
    st={i:0,g:{p:60,e:60,s:60},log:[],laws:["","",""],done:{},flags:{},draw:null,sv:{},chain:{},nteam:st.nteam};
    document.getElementById("sess").textContent="02";
    paintG();render();
  });

  document.addEventListener("keydown",function(ev){
    if(ev.target.tagName==="INPUT")return;
    var k=ev.key.toLowerCase();
    if(ev.key==="ArrowRight"){ev.preventDefault();$nx.click();return;}
    if(ev.key==="ArrowLeft"){ev.preventDefault();$pv.click();return;}
    if(ev.key===" "){ev.preventDefault();togT();return;}
    if(k==="a"){vote(0);return;}
    if(k==="b"){vote(1);return;}
    if(k==="c"){vote(2);return;}
    if(k==="p"){buildPrint("all");setTimeout(function(){try{window.print();}catch(err){}},80);return;}
    if(k==="f"){buildPrint("fiches");setTimeout(function(){try{window.print();}catch(err){}},80);return;}
  });

  buildG();paintG();render();
})();
</script>
